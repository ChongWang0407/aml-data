  if(name==='clock'||name==='info')n.append(sv('circle',{cx:12,cy:12,r:9}));
  if(name==='search')n.append(sv('circle',{cx:10,cy:10,r:6}));
  (ICONS[name]||ICONS.info).forEach(d=>n.append(sv('path',{d})));
  return n;
}
function hydrateIcons(root){(root||document).querySelectorAll('[data-icon]').forEach(n=>{if(!n.firstChild)n.append(icon(n.dataset.icon));});}

const shapeEls=[],labelEls=[],bigEls=[],miniEls=[],gapEls=[],
      branchEls={},hitLayerEls=[],hitBranchEls=[],flowEls=[],pctEls={},
      stemLongEls=[],branchNumEls={},branchNameEls={};
let funnelGeo;

function buildDom(){
  const cs=counts(); geom=buildGeom(cs);
  funnelGeo=sv('svg',{id:'funnelGeo',viewBox:'0 0 700 740','aria-hidden':'true'});
  const defs=sv('defs');
  const mk=sv('marker',{id:'flowArrow',viewBox:'0 0 8 8',refX:5.4,refY:4,markerWidth:5,markerHeight:5,orient:'auto'});
  mk.append(sv('path',{d:'M1 1l4 3-4 3',fill:'none',stroke:'#B6C4DA','stroke-width':1.3}));
  defs.append(mk);
  /* 间隙组只在分离态可见，所以直接按分离态的中心 CX_SPLIT 绘制，不需要两套几何 */
  const GX=GEO.CX_SPLIT;
  for(let i=0;i<4;i++){
    const cp=sv('clipPath',{id:'stemClip'+i});
    cp.append(sv('rect',{class:'stem-clip-rect',x:GX,y:gapY(i)-8,width:GEO.STEM_X-GX,height:16,style:'--i:'+i}));
    defs.append(cp);
  }
  funnelGeo.append(defs);

  /* ---- 间隙组：虚线 + 流转率 + 两个分支明细。先画，让层压在上面 ---- */
  for(let i=0;i<4;i++){
    const g=sv('g',{class:'gap-group','data-gap':i,style:'--i:'+i});
    const gy=gapY(i);
    /* 主链路竖向箭头 + 流转率：只在分离态出现 */
    const spine=sv('path',{class:'spine gap-reveal',d:'M'+GX+' '+(gy-20)+'V'+(gy+16),'marker-end':'url(#flowArrow)',style:'--i:'+i});
    const flow=sv('text',{class:'flow-rate gap-reveal gap-num',x:GX-14,y:gy+8,'text-anchor':'end',style:'--i:'+i});
    const sLongG=sv('g',{'clip-path':'url(#stemClip'+i+')'});
    const sLong=sv('path',{class:'branch-stem gap-reveal',d:'M'+(GX+10)+' '+gy+'H'+(GEO.STEM_X-4),style:'--i:'+i});
    sLongG.append(sLong);
    g.append(spine,flow,sLongG);
    stemLongEls[i]=sLong; flowEls[i]=flow;

    BRANCHES[i+1].forEach((b,j)=>{
      const by=gy-33+j*(GEO.BRANCH_H+GEO.BRANCH_VGAP);
      const bg=sv('g',{class:'branch','data-branch':b[0]});
      bg.append(
        sv('rect',{class:'branch-shape',x:GEO.STEM_X,y:by,width:GEO.BRANCH_W,height:GEO.BRANCH_H,rx:9}),
        sv('rect',{class:'branch-bar',x:GEO.STEM_X+1,y:by+8,width:3,height:14,rx:1.5}),
        sv('text',{class:'branch-name',x:GEO.STEM_X+12,y:by+19},b[1])
      );
      const bn=sv('text',{class:'branch-num',x:GEO.STEM_X+GEO.BRANCH_W-52,y:by+20,'text-anchor':'end'});
      const bp=sv('text',{class:'branch-pct gap-reveal gap-num',x:GEO.STEM_X+GEO.BRANCH_W-12,y:by+20,'text-anchor':'end',style:'--i:'+i});
      bg.append(bn,bp);
      g.append(bg);
      branchEls[b[0]]=bg; pctEls[b[0]]=bp; branchNumEls[b[0]]=bn;
    });
    funnelGeo.append(g); gapEls[i]=g;
  }

  /* ---- 五层主链路：无描边、无每层投影，靠色阶自身分隔。
         侧顶点全部落在 w(y) 的两条直线上 → 剪影零折角 ---- */
  geom.forEach((g,i)=>{
    const lg=sv('g',{class:'layer','data-i':i,style:'--i:'+i});
    const sh=sv('path',{class:'layer-shape',d:g.d,fill:'var(--f'+(i+1)+')'});
    funnelGeo.append(lg);
    lg.append(sh);
    /* 贯通率放漏斗**下方**而不是末层内部：末层只有 56px，三行会溢出。
       放在 L5 组里 → 自动继承 --lx/--ly/--peek-x 与 Genie 缩放，无需单独编排。 */
    shapeEls[i]=sh;
  });
  $('geoWrap').append(funnelGeo);

  /* ---- 文字层：绝不 scale，只 translate。分离位移烘进同一个 translate，
         因此 applyTf 会连带把它乘上 k，与几何层的缩放自动一致 ---- */
  const ll=$('labelLayer');
  geom.forEach((g,i)=>{
    const lab=el('div','layer-label'); lab.dataset.i=i; lab.style.setProperty('--i',i);
    const big=el('div','lbl-big'), mini=el('div','lbl-mini');
    /* 居中两行：中文在上、数字在下。数字后跟小号「条」。
       严格两行 —— 末层只有 56px，塞第三行会溢出到层外（贯通率改放漏斗下方） */
    big.append(el('div','nm',STAGES[i].n),el('div','num'));
    mini.append(el('div','nm',STAGES[i].n),el('div','num'));
    lab.append(big,mini); ll.append(lab);
    labelEls[i]=lab; bigEls[i]=big; miniEls[i]=mini;
  });

  /* ---- 命中层：真实 button，原生焦点环 / 键盘 / aria。不参与动画，动画后 snap 对位 ---- */
  const hl=$('hitLayer');
  geom.forEach((g,i)=>{
    const b=el('button','hit'); b.type='button';
    b.dataset.kind='layer'; b.dataset.i=i;
    hl.append(b); hitLayerEls[i]=b;
  });
  for(let i=0;i<4;i++)BRANCHES[i+1].forEach((br,j)=>{
    const b=el('button','hit'); b.type='button';
    b.dataset.kind='branch'; b.dataset.b=br[0]; b.dataset.gap=i; b.dataset.j=j;
    hl.append(b); hitBranchEls.push(b);
  });
}

/* ==================================================================
   §6  paint*() —— 只写属性 / CSS 变量 / textContent
   ================================================================== */
function paintFunnel(){
  const cs=counts(); geom=buildGeom(cs);
  const n0=cs[0]||1;
  geom.forEach((g,i)=>{
    shapeEls[i].setAttribute('d',g.d);

    const lab=labelEls[i], P=labelP(i), M=applyTf([miniX(),GEO.MINI_TOP],K,P);
    lab.style.setProperty('--px',P[0]+'px'); lab.style.setProperty('--py',P[1]+'px');
    lab.style.setProperty('--mx',M[0]+'px'); lab.style.setProperty('--my',M[1]+'px');
    lab.style.setProperty('--lw-full',(midW(i)-28)+'px');
    lab.style.setProperty('--lw-mini',(midW(i)*K-16)+'px');
    lab.style.setProperty('--lh',g.h+'px');
    lab.style.setProperty('--lh-mini',(g.h*K)+'px');
    lab.style.setProperty('--ly',splitOff(i)+'px');
    /* 数字 + 小号「条」后缀 */
    const nb=bigEls[i].querySelector('.num');
    nb.replaceChildren(document.createTextNode(String(g.n)),el('i','','条'));
    miniEls[i].querySelector('.num').textContent=g.n;
    const lg=shapeEls[i].parentNode;
    lg.style.setProperty('--ly',splitOff(i)+'px');
    lg.style.setProperty('--lx',shiftX()+'px');
    lg.setAttribute('title',STAGES[i].n+' '+g.n+' 条 · '+STAGES[i].d);
  });
  for(let i=0;i<4;i++){
    gapEls[i].style.setProperty('--gy',gapOff(i)+'px');
    flowEls[i].textContent='↓ '+pct(cs[i+1],cs[i])+(cs[i]?'%':'');
    BRANCHES[i+1].forEach(b=>{
      branchNumEls[b[0]].textContent=bcnt(b[0]);
      pctEls[b[0]].textContent=pct(bcnt(b[0]),cs[i])+(cs[i]?'%':'');
    });
  }
  $('funnelTotal').textContent=cs[0];
  snapHits();
}

/* 命中层一次性对位，不参与动画 */
function snapHits(){
  const mini=state.mode==='mini', k=mini?K:1, ty=mini?GEO.MINI_TOP:0, tx=mini?miniX():0;
  const T=p=>[tx+k*p[0], ty+k*p[1]];
  geom.forEach((g,i)=>{
    const p=T([g.left+shiftX(),g.y+splitOff(i)]), b=hitLayerEls[i];
    b.style.left=p[0]+'px'; b.style.top=p[1]+'px';
    b.style.width=(g.w*k)+'px'; b.style.height=(g.h*k)+'px';
    const inset=Math.max(0,(g.w-g.wb)/g.w*50);
    b.style.clipPath='polygon(0 0,100% 0,'+(100-inset).toFixed(2)+'% 100%,'+inset.toFixed(2)+'% 100%)';
    b.setAttribute('aria-label',STAGES[i].n+' '+g.n+' 条，查看该层素材');
    b.setAttribute('aria-pressed',String(!!state.sel&&state.sel.kind==='layer'&&state.sel.i===i));
  });
  hitBranchEls.forEach(b=>{
    const i=+b.dataset.gap, j=+b.dataset.j, id=b.dataset.b;
    const y=gapY(i)+gapOff(i)-33+j*(GEO.BRANCH_H+GEO.BRANCH_VGAP);
    const p=T([GEO.STEM_X,y]);
    b.style.left=p[0]+'px'; b.style.top=p[1]+'px';
    b.style.width=(GEO.BRANCH_W*k)+'px'; b.style.height=(GEO.BRANCH_H*k)+'px';
    /* 合并态分支组整组不可见 → 命中区也必须撤掉，否则会点到看不见的东西 */
    b.style.display=(mini||!state.split)?'none':'block';
    b.setAttribute('aria-label',BRANCHES[i+1].find(x=>x[0]===id)[1]+' '+bcnt(id)+' 条，查看停留素材');
    b.setAttribute('aria-pressed',String(!!state.sel&&state.sel.kind==='branch'&&state.sel.b===id));
  });
}

/* ==================================================================
   §7  Animator —— 单拍向左收缩 + 卡片膨胀
   ================================================================== */
const MOTION={geo:540,card:520,split:380,hover:160,stagger:20,reduced:false};
const mqReduce=matchMedia('(prefers-reduced-motion: reduce)');
function applyMotionPref(){
  MOTION.reduced=mqReduce.matches;
  const on={geo:540,card:520,split:380,hover:160,stagger:20};
  Object.keys(on).forEach(k=>MOTION[k]=MOTION.reduced?0:on[k]);
  document.documentElement.classList.toggle('reduced-motion',MOTION.reduced);
}
mqReduce.addEventListener('change',()=>{applyMotionPref();});
applyMotionPref();

/* ⚠ WAAPI 的 easing 选项不解析 CSS 变量，必须传字面量字符串。
   预采样真实阻尼弹簧 m=1 k=210 c=20，ζ≈0.69，沉降 530ms，过冲 4.8%；末值硬写 1。 */
const SPRING_LINEAR='linear(0,0.1028,0.3184,0.5501,0.7472,0.8909,0.9818,1.0301,1.0483,1.0485,1.0396,1.0280,1.0171,1.0086,1.0028,1)';
const SPRING=CSS.supports('animation-timing-function','linear(0, 1)')
  ? SPRING_LINEAR : 'cubic-bezier(.34,1.56,.64,1)';
const TL={geo:null,labels:[],card:null};

/* 单拍：直接向左收缩，不经过屏幕中部。
   transform-origin 是 0 0 → scale 本身就朝左上收缩；miniX() 是负值再往左推。
   实测左边缘 120→0、右边缘 580→331，全程单调向左，不存在「先缩到中间」的中间态。
   旧版在 56% 处以被点击层为锚点，漏斗会先聚到屏幕中部、正好被放大的右栏盖住。 */
const EASE_GEO='cubic-bezier(.5,0,.22,1)';
function geoKeyframes(){
  return [
    {offset:0, transform:'translate(0px,0px) scale(1)'},
    {offset:1, transform:'translate('+miniX()+'px,'+GEO.MINI_TOP+'px) scale('+K+')'}
  ];
}
function labelKeyframes(i){
  const P=labelP(i), M=applyTf([miniX(),GEO.MINI_TOP],K,P);
  return [
    {offset:0, transform:'translate('+P[0]+'px,'+P[1]+'px)'},
    {offset:1, transform:'translate('+M[0]+'px,'+M[1]+'px)'}
  ];
}
/* 双标签交叉淡入：交换点固定在 0.42（运动最快处），被运动掩盖 */
function crossfade(toMini){
  const o={duration:MOTION.geo,fill:'none'};
  const bk=[{offset:0,opacity:1},{offset:.3,opacity:1},{offset:.5,opacity:0},{offset:1,opacity:0}];
  const mk=[{offset:0,opacity:0},{offset:.42,opacity:0},{offset:.62,opacity:1},{offset:1,opacity:1}];
  const rev=k=>k.slice().reverse().map((f,j)=>({offset:1-k[k.length-1-j].offset,opacity:f.opacity}));
  bigEls.forEach(e=>e.animate(toMini?bk:rev(bk),o));
  miniEls.forEach(e=>e.animate(toMini?mk:rev(mk),o));
}

/* 卡片膨胀：只动 transform / opacity / filter，绝不动 width/height。
   动 width 会让每一帧重新分行文本，是最典型的卡顿源。
   引导线已删 → 膨胀原点改为卡片左缘中点（漏斗收到左侧后的相邻边）。 */
function expandCard(){
  const card=$('sidePanel');
  card.style.transformOrigin='0% 34%';
  return card.animate([
    {transform:'scale(.62)',opacity:0,filter:'blur(3px)'},
    {transform:'scale(1)',opacity:1,filter:'blur(0px)'}
  ],{duration:MOTION.card,easing:MOTION.reduced?'linear':SPRING,fill:'none'});
}

/* --col-funnel / --slot-h 的唯一写入口。
   ⚠ 内联样式优先级高于 media query —— 如果 full 态也写死 --col-funnel，
     首次下钻之后响应式断点就永久失效了，所以 full 态必须 removeProperty 交回 CSS。 */
function applyCols(mini){
  const ws=$('workspace');
  /* 完全不过渡 grid-template-columns，瞬时 snap。视觉运动 100% 由 transform 承担：
     #funnelStage 是 absolute + 固定 700×740 + 父级 overflow:visible，
     渲染结果完全不依赖槽位宽度，列宽跳变的那一帧漏斗一个像素都不变；
     详情卡的布局宽度从第 1 帧起就是终态，表格与长文案只排版一次。 */
  if(mini) ws.style.setProperty('--col-funnel','380px');
  else ws.style.removeProperty('--col-funnel');
  /* 层高改成数据驱动后槽高必须实时算，不能再写死四个常数 */
  const h=GEO.TOP+GEOM_H+(effSplit()?4*GEO.SPLIT_Y:0);
  ws.style.setProperty('--slot-h', Math.round(mini ? h*K+26 : h+30)+'px');
  ws.classList.toggle('mini-on',mini);
}
const setColumns=applyCols;

async function setMode(mode,ai){
  if(state.busy){ TL.geo&&TL.geo.finish(); TL.card&&TL.card.finish(); }
  const stage=$('funnelStage'), toMini=mode==='mini';
  if(state.mode===mode){ renderSide(); return; }
  state.busy=true; Tilt.pause(true);
  /* try/finally 兜底：任何异常都不能把 busy 锁死，否则整个漏斗会永久失去响应 */
  try{
  if(toMini){
    state.anchorIdx=ai;
    stage.classList.add('is-mini');
    state.mode='mini';
    /* mini 与 full 共用 split 状态，仅重算缩放后的标签锚点与槽位高度。 */
    paintLayerTf();
    /* 布局先行：漏斗是 absolute + 固定尺寸，列宽跳变在视觉上不可见 */
    setColumns(true);
    renderSide(true); snapHits();
    const o={duration:MOTION.geo,easing:EASE_GEO,fill:'none'};
    TL.geo=$('geoWrap').animate(geoKeyframes(),o);
    TL.labels=labelEls.map((e,i)=>e.animate(labelKeyframes(i),o));
    crossfade(true);
    $('maximizeBtn').hidden=false;
    await TL.geo.finished.catch(()=>{});
    TL.card=expandCard();
    staggerIn($('sidePanel'));
    await TL.card.finished.catch(()=>{});
  }else{
    const ai2=state.anchorIdx;
    stage.classList.remove('is-mini');
    state.mode='full'; state.sel=null; state.peekId=null;
    $('maximizeBtn').hidden=true;
    paintLayerTf();                 /* 回 full 时若分离开关是开的，层重新抽开 */
    /* 列宽必须在动画开始前 snap 完成，否则详情卡的文本会在每一帧重新分行 */
    setColumns(false);
    renderSide(); snapHits();
    const rev=k=>[k[1],k[0]].map((f,i)=>({offset:i,transform:f.transform}));
    const o={duration:MOTION.geo,easing:EASE_GEO,fill:'none'};
    TL.geo=$('geoWrap').animate(rev(geoKeyframes()),o);
    TL.labels=labelEls.map((e,i)=>e.animate(rev(labelKeyframes(i)),o));
    crossfade(false);
    await TL.geo.finished.catch(()=>{});
  }
  }catch(err){
    console.error('模式切换异常，已降级到终态',err);
    staggerIn($('sidePanel'));
  }finally{
    paintActive(); snapHits();
    state.busy=false; Tilt.pause(false);
    requestSelectionLink();
  }
}

function staggerIn(root){
  const kids=[...root.querySelectorAll('.stagger-in')];
  kids.forEach((n,i)=>setTimeout(()=>n.classList.add('on'),MOTION.stagger*i));
}

function paintActive(){
  const s=state.sel;
  shapeEls.forEach((sh,i)=>{
    sh.parentNode.classList.toggle('is-active',!!s&&s.kind==='layer'&&s.i===i);
  });
  Object.keys(branchEls).forEach(b=>branchEls[b].classList.toggle('is-active',!!s&&s.kind==='branch'&&s.b===b));
  paintPeek();
}
/* 右侧列表点击某条素材 → 它所在的层反相成墨色，其余整组压暗（方案 B）。
   has-peek 挂在舞台上，压暗规则才能一条 CSS 覆盖层 / 标签 / 间隙组 / 分支四类元素。 */
function paintPeek(){
  const r=state.peekId?DATA.find(x=>x.id===state.peekId):null;
  $('funnelStage').classList.toggle('has-peek',!!r);
  shapeEls.forEach((sh,i)=>{
    const on=!!r&&r.stage===i+1;
    sh.parentNode.classList.toggle('is-peek',on);
    labelEls[i].classList.toggle('is-peek',on);
  });
  Object.keys(branchEls).forEach(b=>branchEls[b].classList.toggle('is-peek',!!r&&r.branch===b));
  requestSelectionLink();
}

let selectionLinkFrame=0;
function requestSelectionLink(){
  cancelAnimationFrame(selectionLinkFrame);
  selectionLinkFrame=requestAnimationFrame(updateSelectionLink);
}
function updateSelectionLink(){
  const svg=$('selectionLink'), r=state.peekId?DATA.find(x=>x.id===state.peekId):null;
  const row=r&&$('listRows')&&$('listRows').querySelector('[data-id="'+r.id+'"]');
  const shape=r&&shapeEls[r.stage-1];
  if(!svg||!row||!shape||state.mode!=='mini'){
    if(svg)svg.classList.remove('is-visible');
    return;
  }
  const ws=$('workspace').getBoundingClientRect(), side=$('sidePanel').getBoundingClientRect();
  const funnel=document.querySelector('.funnel-panel').getBoundingClientRect();
  /* 单列响应式布局里两块面板上下堆叠，不画跨越整页的长连线。 */
  if(side.left<funnel.right-20){svg.classList.remove('is-visible');return;}
  const a=shape.getBoundingClientRect(), cell=row.cells[0].getBoundingClientRect();
  const sx=a.right-ws.left+2, sy=a.top+a.height/2-ws.top;
  const ex=cell.left-ws.left-11, ey=cell.top+cell.height/2-ws.top;
  const gap=Math.max(56,ex-sx), c1=sx+gap*.38, c2=ex-gap*.30;
  const d='M'+sx.toFixed(1)+' '+sy.toFixed(1)+' C'+c1.toFixed(1)+' '+sy.toFixed(1)+' '+c2.toFixed(1)+' '+ey.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);
  svg.setAttribute('viewBox','0 0 '+ws.width+' '+ws.height);
  svg.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
  const dot=svg.querySelector('circle'); dot.setAttribute('cx',ex); dot.setAttribute('cy',ey);
  svg.classList.add('is-visible');
}

/* ==================================================================
   §8  Tilt —— 合并态整体倾斜；分层态每一层独立倾斜
   ================================================================== */
/* 数据卡片保留已经确认的 GIF 参考参数；分层漏斗因梯形轮廓单独增强角度和作用范围。 */
const PRESS_MOTION={maxTilt:36,scale:1.1,lerp:.1,grace:40};
const FUNNEL_PRESS={maxTilt:52,scale:1.12,lerp:.115,grace:54};
const PRESS_BASE_SHADOW='drop-shadow(0 1px 2px rgba(15,24,44,.15)) drop-shadow(0 4px 10px rgba(15,24,44,.10)) drop-shadow(0 12px 28px rgba(15,24,44,.07))';
const pressTransform=s=>'rotateY('+(s.x*PRESS_MOTION.maxTilt).toFixed(2)+'deg) rotateX('+(-s.y*PRESS_MOTION.maxTilt).toFixed(2)+'deg) scale3d('+s.scale.toFixed(4)+','+s.scale.toFixed(4)+','+s.scale.toFixed(4)+')';
const funnelPressTransform=s=>'rotateY('+(s.x*FUNNEL_PRESS.maxTilt).toFixed(2)+'deg) rotateX('+(-s.y*FUNNEL_PRESS.maxTilt).toFixed(2)+'deg) scale3d('+s.scale.toFixed(4)+','+s.scale.toFixed(4)+','+s.scale.toFixed(4)+')';
const pressShadow=s=>PRESS_BASE_SHADOW+' drop-shadow('+s.shadowX.toFixed(2)+'px '+(s.shadowY+10).toFixed(2)+'px '+s.blur.toFixed(2)+'px rgba(15,24,44,'+s.opacity.toFixed(3)+'))';
const neutralPress=()=>({x:0,y:0,scale:1,shadowX:0,shadowY:0,blur:0,opacity:0});

const Tilt=(function(){
  const TILT={rot:3.5,miniRot:2,shift:5,lerp:.09,dwell:300,grace:40};
  const wrap=()=>$('tiltWrap');
  const cur={x:0,y:0}, tgt={x:0,y:0};
  const layer={i:-1,hit:null,rect:null,cursorX:0,cursorY:0,active:false,running:false,
    motion:neutralPress(),target:neutralPress()};
  const finePointer=matchMedia('(hover: hover) and (pointer: fine)');
  let cx=0,cy=0,active=false,hovering=false,running=false,paused=false,timer=null,lastPointer=null;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
  const lerp=(a,b,f)=>a+(b-a)*f;

  function frame(){
    const rot=state.mode==='mini'?TILT.miniRot:TILT.rot;
    if(active&&!paused&&!MOTION.reduced&&!effSplit()){ tgt.x=cx; tgt.y=cy; }
    else { tgt.x=0; tgt.y=0; }
    cur.x=lerp(cur.x,tgt.x,TILT.lerp); cur.y=lerp(cur.y,tgt.y,TILT.lerp);
    const w=wrap();
    w.style.transform='translate3d('+(cur.x*TILT.shift).toFixed(2)+'px,'+(cur.y*TILT.shift).toFixed(2)+'px,0)'
      +' rotateY('+(cur.x*rot).toFixed(2)+'deg) rotateX('+(-cur.y*rot).toFixed(2)+'deg)';
    /* 阴影随倾斜反向偏移，模拟光从上方 */
    w.style.filter='drop-shadow('+(-cur.x*9).toFixed(1)+'px '+(-cur.y*9+7).toFixed(1)+'px 16px rgba(28,52,96,.14))';
    if(state.peekId)requestSelectionLink();
    const settled=Math.abs(cur.x-tgt.x)<0.002&&Math.abs(cur.y-tgt.y)<0.002;
    if(settled){
      running=false;
      if(!active||paused||MOTION.reduced){
        /* 归零后清空 transform，脱离 3D 渲染上下文 →
           静止状态的文字完全清晰，只在运动过程中有可感知的软化 */
        w.style.transform=''; w.style.filter='';
        cur.x=cur.y=0;
      }
    } else requestAnimationFrame(frame);
  }
  const start=()=>{ if(!running){running=true;requestAnimationFrame(frame);} };

  function layerVisual(i,s){
    if(i<0||!shapeEls[i])return;
    const tf=funnelPressTransform(s);
    shapeEls[i].style.transform=tf;
    shapeEls[i].style.filter=pressShadow(s);
    labelEls[i].querySelectorAll('.lbl-big,.lbl-mini').forEach(n=>{n.style.transform=tf;});
    if(state.peekId)requestSelectionLink();
  }
  function clearLayer(i){
    if(i<0||!shapeEls[i])return;
    shapeEls[i].style.transform='';shapeEls[i].style.filter='';
    labelEls[i].querySelectorAll('.lbl-big,.lbl-mini').forEach(n=>{n.style.transform='';});
  }
  function layerFrame(){
    const on=layer.active&&effSplit()&&!paused&&!MOTION.reduced;
    Object.assign(layer.target,on?{
      x:layer.cursorX,y:layer.cursorY,scale:FUNNEL_PRESS.scale,
      shadowX:-layer.cursorX*20,shadowY:-layer.cursorY*20,blur:30,opacity:.25
    }:neutralPress());
    Object.keys(layer.motion).forEach(k=>layer.motion[k]=lerp(layer.motion[k],layer.target[k],FUNNEL_PRESS.lerp));
    layerVisual(layer.i,layer.motion);
    const settled=Object.keys(layer.motion).every(k=>Math.abs(layer.motion[k]-layer.target[k])<.004);
    if(settled){
      layer.running=false;
      if(!on){const i=layer.i;layer.motion=neutralPress();layer.target=neutralPress();clearLayer(i);layer.i=-1;layer.hit=null;layer.rect=null;}
    }else requestAnimationFrame(layerFrame);
  }
  const startLayer=()=>{if(!layer.running&&layer.i>=0){layer.running=true;requestAnimationFrame(layerFrame);}};
  function beginLayer(hit,e){
    const i=+hit.dataset.i;
    if(layer.i!==i){clearLayer(layer.i);layer.motion=neutralPress();layer.target=neutralPress();layer.i=i;layer.hit=hit;}
    layer.rect=hit.getBoundingClientRect();layer.active=true;
    pointLayer(e,hit);startLayer();
  }
  function pointLayer(e,hit){
    if(layer.i!==+hit.dataset.i){beginLayer(hit,e);return;}
    const r=layer.rect||hit.getBoundingClientRect();
    layer.cursorX=clamp((e.clientX-r.left)/r.width-.5,-.65,.65);
    layer.cursorY=clamp((e.clientY-r.top)/r.height-.5,-.65,.65);
    startLayer();
  }
  function releaseLayer(){layer.active=false;startLayer();}

  function init(){
    const stage=$('funnelStage'), hits=$('hitLayer');
    stage.addEventListener('mouseenter',()=>{
      hovering=true;
      /* dwell：鼠标需停留 300ms 才激活，快速划过不触发，否则页面会一直在抖 */
      timer=setTimeout(()=>{ if(hovering&&!effSplit()&&!MOTION.reduced){active=true;start();} },TILT.dwell);
    });
    stage.addEventListener('mouseleave',()=>{hovering=false;active=false;clearTimeout(timer);if(!effSplit())releaseLayer();start();});
    hits.addEventListener('pointerover',e=>{
      if(!effSplit()||!finePointer.matches)return;
      const hit=e.target.closest('.hit[data-kind="layer"]');
      if(hit)beginLayer(hit,e);
    });
    hits.addEventListener('pointermove',e=>{
      lastPointer=e;
      if(!effSplit()||!finePointer.matches)return;
      const hit=e.target.closest('.hit[data-kind="layer"]');
      if(hit)pointLayer(e,hit);
    },{passive:true});
    hits.addEventListener('pointerout',e=>{
      if(!effSplit()||!finePointer.matches)return;
      const from=e.target.closest('.hit[data-kind="layer"]');
      const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.hit[data-kind="layer"]');
      if(from&&from!==to){
        const r=layer.rect||from.getBoundingClientRect(),g=FUNNEL_PRESS.grace;
        const inGrace=e.clientX>=r.left-g&&e.clientX<=r.right+g&&e.clientY>=r.top-g&&e.clientY<=r.bottom+g;
        if(!inGrace)releaseLayer();
      }
    });
    hits.addEventListener('pointercancel',releaseLayer);
    /* 挂在 document 上只读 rect，passive 不拦截任何事件 → 完全不影响命中层的点击 */
    document.addEventListener('mousemove',e=>{
      lastPointer=e;
      const r=$('funnelStage').getBoundingClientRect();
      if(!r.width)return;
      cx=clamp((e.clientX-r.left)/r.width-0.5,-0.5,0.5);
      cy=clamp((e.clientY-r.top)/r.height-0.5,-0.5,0.5);
      if(effSplit()&&finePointer.matches&&layer.i>=0&&layer.rect){
        const lr=layer.rect,g=FUNNEL_PRESS.grace;
        const inLayerGrace=e.clientX>=lr.left-g&&e.clientX<=lr.right+g&&e.clientY>=lr.top-g&&e.clientY<=lr.bottom+g;
        if(inLayerGrace){
          layer.active=true;
          layer.cursorX=clamp((e.clientX-lr.left)/lr.width-.5,-.65,.65);
          layer.cursorY=clamp((e.clientY-lr.top)/lr.height-.5,-.65,.65);
          startLayer();
        }else if(layer.active)releaseLayer();
      }
      if(active&&!effSplit()){
        /* grace：鼠标略微移出边界时效果不中断，避免边缘抖动导致启停闪烁 */
        const inG=e.clientX>=r.left-TILT.grace&&e.clientX<=r.right+TILT.grace
               && e.clientY>=r.top-TILT.grace&&e.clientY<=r.bottom+TILT.grace;
        if(!inG){ hovering=false; active=false; clearTimeout(timer); }
        start();
      }
    },{passive:true});
  }
  function modeChanged(){
    active=false;layer.active=false;clearTimeout(timer);shapeEls.forEach((_,i)=>clearLayer(i));layer.i=-1;layer.hit=null;layer.rect=null;
    layer.motion=neutralPress();layer.target=neutralPress();start();
    if(!effSplit()&&lastPointer){
      const r=$('funnelStage').getBoundingClientRect();
      hovering=lastPointer.clientX>=r.left&&lastPointer.clientX<=r.right&&lastPointer.clientY>=r.top&&lastPointer.clientY<=r.bottom;
      if(hovering&&!MOTION.reduced)timer=setTimeout(()=>{active=true;start();},TILT.dwell);
    }
  }
  return {init,modeChanged,pause(p){paused=p;if(p){layer.active=false;shapeEls.forEach((_,i)=>clearLayer(i));layer.i=-1;layer.hit=null;layer.rect=null;}start();startLayer();}};
})();

/* ==================================================================
   §9  Split —— 层分离 / 层间流转标注
   d 属性不可插值（要求路径命令数完全一致），改 y 只能瞬变、没有动效。
   所以基准几何用合并态，分离靠 translateY 叠加。
   ================================================================== */
/* 层与标签的位移基准。--lx/--ly/--px/--py 全部依赖 effSplit()。 */
function paintLayerTf(){
  geom.forEach((g,i)=>{
    const lg=shapeEls[i].parentNode;
    lg.style.setProperty('--ly',splitOff(i)+'px');
    lg.style.setProperty('--lx',shiftX()+'px');   /* 分支隐藏时五层回到舞台正中 */
    const lab=labelEls[i],P=labelP(i),M=applyTf([miniX(),GEO.MINI_TOP],K,P);
    lab.style.setProperty('--px',P[0]+'px'); lab.style.setProperty('--py',P[1]+'px');
    lab.style.setProperty('--mx',M[0]+'px'); lab.style.setProperty('--my',M[1]+'px');
  });
  for(let i=0;i<4;i++)gapEls[i].style.setProperty('--gy',gapOff(i)+'px');
  syncMiniX();                      /* --lx 变了，mini 归位偏移必须跟着变 */
}

function setSplit(on){
  state.split=on;
  const stage=$('funnelStage');
  const control=$('splitToggle');
  control.classList.remove('is-animating');
  control.setAttribute('aria-checked',String(on));
  void control.offsetWidth;
  control.classList.add('is-animating');
  clearTimeout(control.__motionTimer);
  control.__motionTimer=setTimeout(()=>control.classList.remove('is-animating'),440);
  stage.classList.toggle('is-split',on);
  Tilt.modeChanged();
  paintLayerTf();
  applyCols(state.mode==='mini');   /* 槽位高度随分离态变化 */
  /* 分离过渡期间禁用层点击，避免与 Genie 叠加 */
  const lock=MOTION.split+120;
  hitLayerEls.concat(hitBranchEls).forEach(b=>b.disabled=true);
  setTimeout(()=>{hitLayerEls.concat(hitBranchEls).forEach(b=>b.disabled=false);snapHits();requestSelectionLink();},lock);
}

/* ==================================================================
   §10  thumbnail —— 程序化 SVG：3 游戏 × 5 创意类型，同风格不重复
   ================================================================== */
const THUMB={
  'Arrows':['#EAF1EC','#5F8A76','#B9D4C0'],
  'War Drone':['#E4EAF2','#5B7AA5','#BFCFE2'],
  '8 Ball Pool':['#E8EFEA','#3F7A5C','#C3DCCB']
};
const GAME_ICON={'Arrows':'arrows.png','War Drone':'war-drone.png','8 Ball Pool':'8ball.png'};
/* 缩略图 = 该素材所属游戏的图标，与筛选器里的三个图标严格同一套资源。
   用 SVG <image> 而不是 <img>：调用方只 append 一个节点，viewBox 负责等比适配，
   .thumb 与详情页大图两处尺寸完全不同也不用各写一套 CSS。 */
function thumbnail(r,large){
  const pal=THUMB[r.game]||THUMB['Arrows'];
  const s=sv('svg',{viewBox:'0 0 100 128',role:'img','aria-label':r.game+' 素材封面'});
  /* 图标自带白底，所以底色也用白 —— 否则会在色块中央露出一个白方块 */
  s.append(sv('rect',{width:100,height:128,fill:'#FFFFFF'}));
  const box=large?96:94, x=(100-box)/2, y=(128-box)/2;
  const im=sv('image',{href:'icons/'+(GAME_ICON[r.game]||'arrows.png'),
    x,y,width:box,height:box,preserveAspectRatio:'xMidYMid meet'});
  im.setAttributeNS('http://www.w3.org/1999/xlink','href','icons/'+(GAME_ICON[r.game]||'arrows.png'));
  s.append(im);
  if(large)s.append(sv('text',{x:9,y:120,fill:pal[1],'font-size':7,'font-family':'Manrope, sans-serif'},r.id));
  return s;
}

/* ==================================================================
   §12  侧栏 —— 窄栏态：本批次关键结论卡；展开态：逐素材明细清单
   ================================================================== */
function rejectDist(){
  const m={};
  base().filter(r=>r.branch==='adopt_rejected').forEach(r=>m[r.rejectReasonCode]=(m[r.rejectReasonCode]||0)+1);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function filteredList(){
  let list=scoped().filter(r=>{
    if(state.reason!=='all'&&r.rejectReasonCode!==state.reason)return false;
    if(!state.query)return true;
    const q=state.query.toLowerCase();
    return [r.id,r.title,r.rejectReasonText,r.holdNote,r.reviewInsight,r.decisionOwner,r.market,r.game]
      .filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  return list.sort((a,b)=>state.sort==='new'
    ? b.deliveryDate.localeCompare(a.deliveryDate)||b.id.localeCompare(a.id)
    : a.deliveryDate.localeCompare(b.deliveryDate)||a.id.localeCompare(b.id));
}
function branchName(b){
  for(let L=1;L<=4;L++){const f=BRANCHES[L].find(x=>x[0]===b);if(f)return f[1];}
  return b;
}
function branchLayer(b){for(let L=1;L<=4;L++)if(BRANCHES[L].some(x=>x[0]===b))return L;return 1;}

/* defer=true 只用于 Genie 折叠那一路：此时希望内容等漏斗收缩完成后再逐条落位。
   其余所有调用（初始加载、筛选重绘、mini 态内换选中）都必须立即显现，
   否则 .stagger-in 会一直停在 opacity:0，整块面板看起来是空的。 */
function renderSide(defer){
  const p=$('sidePanel'); p.replaceChildren();
  if(state.mode==='full'){ renderVerdicts(p); }
  else { renderList(p); }
  hydrateIcons(p);
  if(!defer)requestAnimationFrame(()=>staggerIn(p));
}

/* 五个可选维度。跑量最差与改版提升最大是评测同学真正要看的两个 ——
   一个找失败归因、一个验证改版是否有效。 */
const PICKS=[
  ['top',   '跑量最好'], ['bottom','跑量最差'], ['score', '评分最高'],
  ['new',   '最新交付'], ['gain',  '改版提升最大']
];
function pickList(){
  const b=base();
  if(state.pick==='top')
    return b.filter(r=>r.recovered&&r.metrics&&r.metrics.installs)
            .sort((x,y)=>y.metrics.installs-x.metrics.installs);
  if(state.pick==='bottom')
    return b.filter(r=>r.recovered&&r.branch!=='sample_short'&&r.metrics&&r.metrics.impressions>=SAMPLE_THRESHOLD)
            .sort((x,y)=>(x.metrics.installs||0)-(y.metrics.installs||0));
  if(state.pick==='score')
    return b.filter(r=>r.reviewed&&r.reviewScore!=null).sort((x,y)=>y.reviewScore-x.reviewScore);
  if(state.pick==='gain')
    return b.filter(r=>{
      if(!r.parentId)return false;
      const pa=DATA.find(x=>x.id===r.parentId);
      return pa&&r.stage>pa.stage;
    }).sort((x,y)=>{
      const g=r=>{const pa=DATA.find(x=>x.id===r.parentId);
        const a=(r.metrics&&r.metrics.installs)||0, c=(pa.metrics&&pa.metrics.installs)||0;
        return c?a/c:(r.stage-pa.stage);};
      return g(y)-g(x);
    });
  return b.slice().sort((x,y)=>y.deliveryDate.localeCompare(x.deliveryDate));
}
/* 结果卡：一条素材的关键指标 + 归因。点击开详情弹窗，hover 让左侧漏斗对应层抽出 */
function pickCard(r){
  const c=el('div','verdict-card stagger-in');
  const t=el('div','verdict-top');
  t.append(el('span','verdict-tag',stayLabel(r)),el('span','',r.game+' · '+r.market+' · '+r.version));
  c.append(t,el('strong','',r.title));
  const pp=el('p');
  const add=(k,v)=>{ if(pp.childNodes.length)pp.append(document.createTextNode(' · '));
    pp.append(document.createTextNode(k+' '),el('b','num',v)); };
  if(r.metrics&&r.metrics.installs)add('安装',num(r.metrics.installs));
  if(r.metrics&&r.metrics.impressions)add('CTR',pct(r.metrics.clicks,r.metrics.impressions)+'%');
  if(r.reviewScore!=null)add('评分',String(r.reviewScore));
  if(spendOf(r))add('花费','$'+num(Math.round(spendOf(r))));
  if(pp.childNodes.length)c.append(pp);
  const sd=stayDetail(r);
  if(sd&&sd!=='—')c.append(el('p','',sd));
  c.append(el('p','muted-note',r.id+' · 交付 '+r.deliveryDate.replace(/-/g,'.')));
  c.dataset.open=r.id; c.style.cursor='pointer';
  /* hover 同步高亮左侧漏斗对应层（复用 is-peek 的抽出效果） */
  c.addEventListener('pointerenter',()=>{ state.peekId=r.id; paintPeek(); });
  c.addEventListener('pointerleave',()=>{ state.peekId=null; paintPeek(); });
  return c;
}

function renderVerdicts(p){
  const wrap=el('div'); wrap.style.padding='22px 24px 24px';

  /* ---- 维度下拉 + 搜索栏 ---- */
  const bar=el('div','pick-bar');
  const sel=el('select'); sel.id='pickSelect'; sel.setAttribute('aria-label','选择结论维度');
  PICKS.forEach(([v,n])=>sel.append(new Option(n,v)));
  sel.value=state.pick;
  sel.disabled=!!state.pickQuery;
  sel.addEventListener('change',e=>{ state.pick=e.target.value; renderSide(); });
  const box=el('div','search-box');
  const si=el('span'); si.dataset.icon='search';
  const inp=el('input'); inp.type='search'; inp.placeholder='搜索素材名称或编号';
  inp.value=state.pickQuery; inp.setAttribute('aria-label','搜索素材');
  inp.addEventListener('input',e=>{ state.pickQuery=e.target.value; renderSide(); });
  box.append(si,inp);
  bar.append(sel,box);
  wrap.append(bar);

  /* ---- 结果卡：默认维度 Top 3；搜索命中则替换为命中结果 ---- */
  let rows, label;
  if(state.pickQuery.trim()){
    const q=state.pickQuery.trim().toLowerCase();
    rows=base().filter(r=>(r.title+' '+r.id+' '+r.game+' '+r.market).toLowerCase().includes(q)).slice(0,6);
    label=rows.length?'搜索命中 '+rows.length+' 条':'没有匹配的素材';
  }else{
    rows=pickList().slice(0,3);
    label=PICKS.find(x=>x[0]===state.pick)[1]+(rows.length?' · 前 '+rows.length+' 条':'');
  }
  wrap.append(el('div','rail-label',label));
  if(!rows.length)wrap.append(el('p','muted-note','当前筛选与关键词下没有符合条件的素材，试试放宽筛选或换个维度。'));
  rows.forEach(r=>wrap.append(pickCard(r)));

  /* 未采用原因分布，可点击下钻。命中 1 条时上面卡少了，这块会自然上移 */
  const rd=rejectDist(), rej=bcnt('adopt_rejected');
  wrap.append(el('div','section-gap'));
  wrap.append(el('div','rail-label','未采用原因分布'));
  const dist=el('div','stagger-in');
  if(!rd.length)dist.append(el('p','muted-note','当前筛选下没有未采用素材。'));
  rd.slice(0,5).forEach(([code,n])=>{
    const row=el('button','reason-row'); row.type='button';
    const line=el('div','reason-line');
    const lbl=el('div','reason-label');
    lbl.append(el('span','',REJECT_REASONS[code]),el('b','',n+' 条'));
    const trk=el('div','reason-track'); const bar=el('i');
    bar.style.width=(n/rd[0][1]*100)+'%'; trk.append(bar);
    line.append(lbl,trk); row.append(line);
    row.addEventListener('click',()=>{ state.reason=code; select({kind:'branch',b:'adopt_rejected'}); });
    dist.append(row);
  });
  wrap.append(dist);

  /* 数据缺口提示 */
  const gapN=bcnt('recover_delay')+bcnt('recover_unmatched'), shortN=bcnt('sample_short'), pendN=bcnt('adopt_pending');
  wrap.append(el('div','section-gap'));
  const note=el('div','gap-note stagger-in');
  const ic=el('span'); ic.dataset.icon='clock';
  const nb=el('div');
  nb.append(el('strong','',pendN+' 条待业务评审 · '+gapN+' 条数据未回收 · '+shortN+' 条样本不足'));
  nb.append(el('p','','这些都是处理状态，不计为创意失败；点击漏斗上对应的分支可以看到逐条明细与卡点原因。'));
  note.append(ic,nb);
  wrap.append(note);
  p.append(wrap);
}

function renderList(p){
  const s=state.sel, isBranch=s.kind==='branch';
  const title=isBranch?branchName(s.b)+'素材':STAGES[s.i].n+'素材';
  const path=isBranch
    ? STAGES[branchLayer(s.b)-1].n+' → '+STAGES[branchLayer(s.b)].n+' / '+branchName(s.b)+'分支'
    : '主链路 / '+STAGES[s.i].n;
  const sub=isBranch?BRANCH_DESC[s.b]:'累计进入此层级的独立素材版本，具体去向与停留状态可在详情中查看。';

  const head=el('div','panel-heading');
  const hl=el('div');
  hl.append(el('div','rail-label',path));
  const hi=el('div','heading-inline');
  const h2=el('h2','',title); h2.id='sideTitle';
  const cb=el('span','count-bubble'); cb.id='listCount';
  hi.append(h2,cb); hl.append(hi,el('p','',sub));
  const acts=el('div','panel-actions');
  const exp=el('button','download-button'); exp.type='button';exp.setAttribute('aria-label','导出素材清单');
  const docs=el('span','docs'),download=el('span','download');
  docs.append(el('span','','导出'));
  const ei=el('span');ei.dataset.icon='download';ei.setAttribute('aria-hidden','true');download.append(ei);exp.append(docs,download);
  exp.addEventListener('click',()=>exportCSV(filteredList(),title));
  const cls=el('button','icon-button'); cls.type='button'; cls.setAttribute('aria-label','收起，返回大漏斗');

function refreshList(){
  const p=$('sidePanel'), tbody=$('listRows'); if(!tbody)return;
  const sc=scoped();
  const rsel=p.querySelector('.list-controls select');
  if(rsel){
    const codes=[...new Set(sc.map(r=>r.rejectReasonCode).filter(Boolean))];
    rsel.replaceChildren(new Option('全部原因','all'));
    codes.forEach(c=>rsel.append(new Option(REJECT_REASONS[c],c)));
    if(!codes.includes(state.reason))state.reason='all';
    rsel.value=state.reason;
    rsel.style.display=codes.length?'block':'none';
  }
  const list=filteredList();
  const pages=Math.max(1,Math.ceil(list.length/PER_PAGE));
  state.page=Math.min(Math.max(1,state.page),pages);
  $('listCount').textContent=list.length;
  $('listPage').textContent=state.page+' / '+pages;
  $('listInfo').textContent='共 '+list.length+' 条'+(list.length!==sc.length?'（当前层级 '+sc.length+' 条）':'');
  const strip=$('scopeStrip'); strip.replaceChildren();
  const pill=el('span','scope-pill'+(state.sel.kind==='branch'?' warm':''));
  pill.append(document.createTextNode(state.sel.kind==='branch'?branchName(state.sel.b):STAGES[state.sel.i].n));
  const x=el('button','','×'); x.type='button'; x.setAttribute('aria-label','清除筛选，返回大漏斗');
  x.addEventListener('click',()=>setMode('full'));
  pill.append(x);
  strip.append(pill,el('span','',(state.game==='all'?'全部游戏':state.game)+' · '+rangeLabel()));

  tbody.replaceChildren();
  if(!list.length){
    const tr=el('tr'), td=el('td','empty-row'); td.colSpan=7;
    td.append(el('strong','','没有符合条件的素材'),el('span','','试试更换原因筛选或清除搜索关键词。'));
    tr.append(td); tbody.append(tr); return;
  }
  list.slice((state.page-1)*PER_PAGE,state.page*PER_PAGE).forEach(r=>{
    const tr=el('tr','row-click'+(state.peekId===r.id?' row-sel':'')); tr.dataset.id=r.id;
    /* 素材 / 版本 */
    const td1=el('td'); const as=el('div','asset');
    const th=el('div','thumb'); th.append(thumbnail(r));
    const cp=el('div');
    const nm=el('div','asset-name',r.title); nm.title=r.title;
    const idl=el('div','asset-id'); idl.append(document.createTextNode(r.id+' · '+r.version));
    if(r.parentId){const vb=el('span','ver-badge','改版 ←');vb.title='上一版：'+r.parentId;idl.append(vb);}
    cp.append(nm,idl); as.append(th,cp); td1.append(as);
    /* 游戏：只显示游戏名，加粗 */
    const td2=el('td'); td2.append(el('div','cell-game',r.game));
    /* 交付日期：2026.09.19 */
    const td3=el('td'); td3.append(el('div','cell-date',dt(r.deliveryDate)));
    /* 停留位置：彩色底框 + 加粗 */
    const td4=el('td');
    td4.append(el('span','status-chip '+(r.stage===5?(r.verdict==='win'?'win':r.verdict==='lose'?'lose':'cool'):'warm'),stayLabel(r)));
    /* 业务反馈：直接给原因原文，不要分类标题 */
    const td5=el('td','reason-cell'); td5.append(el('p','',feedbackText(r)));
    /* 负责人 */
    const td6=el('td'); td6.append(el('div','cell-owner',r.decisionOwner));
    /* 详情箭头 */
    const td7=el('td');
    const arrow=el('button','detail-arrow'); arrow.type='button';
    arrow.setAttribute('aria-label','查看 '+r.title+' 的完整档案');
    const ai=el('span'); ai.dataset.icon='arrow'; arrow.append(ai);
    arrow.addEventListener('click',e=>{e.stopPropagation();openMaterial(r.id);});
    td7.append(arrow);
    tr.append(td1,td2,td3,td4,td5,td6,td7);
    /* 行点击 = 在左侧漏斗同步高亮该素材所在的层与停留分支 */
    tr.addEventListener('click',()=>{
      state.peekId=state.peekId===r.id?null:r.id;
      paintPeek();
      tbody.querySelectorAll('tr').forEach(n=>n.classList.toggle('row-sel',n.dataset.id===state.peekId));
    });
    tbody.append(tr);
  });
  hydrateIcons(tbody);
  const tableWrap=tbody.closest('.table-wrap');
  if(tableWrap&&!tableWrap.dataset.linkBound){
    tableWrap.dataset.linkBound='true';
    tableWrap.addEventListener('scroll',requestSelectionLink,{passive:true});
  }
  requestSelectionLink();
}

function exportCSV(list,label){
  try{
    if(!list.length){toast('没有可导出的素材');return;}
    const F=[['素材编号','id'],['名称','title'],['游戏','game'],['版本','version'],['上一版','parentId'],
      ['需求','briefTitle'],['市场','market'],['创意类型','creativeType'],['交付日期','deliveryDate'],
      ['反馈日期',r=>latestFeedback(r)||''],['停留层级',r=>r.stage+' '+STAGES[r.stage-1].n],
      ['停留位置',r=>stayLabel(r)],['原因分类',r=>r.rejectReasonCode?REJECT_REASONS[r.rejectReasonCode]:''],
      ['业务反馈',r=>stayDetail(r)||''],['曝光',r=>r.metrics?r.metrics.impressions:''],
      ['花费（USD）',r=>r.metrics&&r.metrics.spend!=null?r.metrics.spend:''],['负责人','decisionOwner']];
    const cell=v=>'"'+String(v==null?'':v).replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';
    const csv='\uFEFF'+[F.map(f=>cell(f[0])).join(',')]
      .concat(list.map(r=>F.map(f=>cell(typeof f[1]==='function'?f[1](r):r[f[1]])).join(','))).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}), url=URL.createObjectURL(blob), a=el('a');
    a.href=url; a.download='MuseLab_'+(label||'素材明细')+'_演示数据.csv';
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('已导出 '+list.length+' 条素材');
  }catch(e){ toast('导出未完成，请重试'); }
}

  /* AI 生成元数据 */
  const ai=section('生成信息');
  const at=el('table','caliber-table');

  hydrateIcons(body);

function lifebar(r,big){
  const wrap=el('div');
  const bar=el('div','lifebar');
  for(let i=0;i<5;i++){
    const done=r.stage>=i+1;
    const node=el('div','node'+(done?' done':'')+(r.stage===i+1?' stay':''));
    if(done)node.style.background='var(--f'+(i+1)+')';
    bar.append(node);
    if(i<4)bar.append(el('div','seg '+(r.stage>=i+2?'done':'todo')));
  }
  wrap.append(bar);
  const lg=el('div','life-legend');
  ['交付','采用','上线','回收','评测'].forEach(t=>lg.append(el('span','',t)));
  wrap.append(lg);
  if(big)wrap.style.marginBottom='14px';
  return wrap;
}

function trackList(){
  let l=base().filter(r=>{
    if(state.trkStage!=='all'&&r.stage!==+state.trkStage)return false;
    if(state.trkBranch!=='all'&&r.branch!==state.trkBranch)return false;
    if(state.trkRevised==='yes'&&r.generation===1)return false;
    if(state.trkRevised==='no'&&r.generation>1)return false;
    if(state.trkRevised==='parent'&&!r.childIds.length)return false;
    if(!state.trkQuery)return true;
    const q=state.trkQuery.toLowerCase();
    return [r.id,r.title,r.rejectReasonText,r.holdNote,r.reviewInsight,r.decisionOwner,r.market,r.game,r.briefTitle]
      .filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  const S=state.trkSort;
  return l.sort((a,b)=>
    S==='new'?b.deliveryDate.localeCompare(a.deliveryDate):
    S==='old'?a.deliveryDate.localeCompare(b.deliveryDate):
    S==='deep'?(b.stage-a.stage)||b.deliveryDate.localeCompare(a.deliveryDate):
    S==='shallow'?(a.stage-b.stage)||b.deliveryDate.localeCompare(a.deliveryDate):
    S==='spend'?spendOf(b)-spendOf(a):ctrOf(b)-ctrOf(a));
}
function renderTrack(){
  const sSel=$('trkStage');

  const bSel=$('trkBranch');
  if(bSel.options.length<=1)for(let L=1;L<=4;L++)BRANCHES[L].forEach(b=>bSel.append(new Option(b[1],b[0])));

  const list=trackList();
  const pages=Math.max(1,Math.ceil(list.length/TRK_PER_PAGE));
  state.trkPage=Math.min(Math.max(1,state.trkPage),pages);
  $('trackCount').textContent=list.length;

    td.append(el('strong','','没有符合条件的素材'),el('span','','试试放宽停留层级或清除搜索关键词。'));
    tr.append(td); tb.append(tr); return;
  }
  list.slice((state.trkPage-1)*TRK_PER_PAGE,state.trkPage*TRK_PER_PAGE).forEach(r=>{
    const tr=el('tr','row-click'); tr.dataset.id=r.id;
    const td1=el('td'); const as=el('div','asset');
    const th=el('div','thumb'); th.append(thumbnail(r));
    const cp=el('div');
    const nm=el('div','asset-name',r.title); nm.title=r.title;
    const idl=el('div','asset-id'); idl.append(document.createTextNode(r.id+' · '+r.version));
    if(r.parentId){
      const vb=el('span','ver-badge','改版 ←'); vb.title='上一版：'+r.parentId+'，点击跳转';
      vb.addEventListener('click',e=>{e.stopPropagation();jumpTo(r.parentId);});

      const vb=el('span','ver-badge','有改版 →'); vb.title='后续版本：'+r.childIds.join('、')+'，点击跳转';
      vb.addEventListener('click',e=>{e.stopPropagation();jumpTo(r.childIds[0]);});
      vb.style.cursor='pointer'; idl.append(vb);
    }
    cp.append(nm,idl); as.append(th,cp); td1.append(as);
    const td2=el('td'); td2.append(el('div','',r.game),el('div','cell-2',r.market+' · '+r.creativeType));
    const td3=el('td'); td3.append(lifebar(r));

    td4.append(el('span','status-chip '+(r.stage===5?(r.verdict==='win'?'win':r.verdict==='lose'?'lose':'cool'):'warm'),stayLabel(r)));
    const dl=el('div','cell-2',stayDetail(r)||'—'); dl.style.maxWidth='240px'; td4.append(dl);
    const td5=el('td'); td5.append(el('div','',dt(r.deliveryDate)),el('div','cell-2',shortDt(latestFeedback(r))));
    const td6=el('td'); td6.append(el('div','',r.decisionOwner));
    tr.append(td1,td2,td3,td4,td5,td6);
    tr.addEventListener('click',()=>openMaterial(r.id));
    tb.append(tr);
  });
}
function jumpTo(id){
  const l=trackList(), idx=l.findIndex(r=>r.id===id);
  if(idx<0){ state.trkStage='all';state.trkBranch='all';state.trkRevised='all';state.trkQuery='';
    $('trackSearch').value='';$('trkStage').value='all';$('trkBranch').value='all';$('trkRevised').value='all';
    return jumpTo(id); }
  state.trkPage=Math.floor(idx/TRK_PER_PAGE)+1;
  renderTrack();
  const row=$('trackRows').querySelector('[data-id="'+id+'"]');
  if(row){ row.classList.add('row-flash'); row.scrollIntoView({block:'center',behavior:MOTION.reduced?'auto':'smooth'}); }
}

function bindDashboardPress(card){
  const fine=matchMedia('(hover: hover) and (pointer: fine)');

  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b),lerp=(a,b,f)=>a+(b-a)*f;
  function frame(){
    const on=active&&fine.matches&&!MOTION.reduced;
    Object.assign(target,on?target:neutralPress());
    Object.keys(motion).forEach(k=>motion[k]=lerp(motion[k],target[k],PRESS_MOTION.lerp));
    card.style.transform=pressTransform(motion);card.style.filter=pressShadow(motion);
    const settled=Object.keys(motion).every(k=>Math.abs(motion[k]-target[k])<.004);
    if(settled){running=false;if(!on){card.style.transform='';card.style.filter='';card.classList.remove('is-tilting');Object.assign(motion,neutralPress());}}
    else requestAnimationFrame(frame);
  }
  const start=()=>{if(!running){running=true;requestAnimationFrame(frame);}};
  function point(e){
    if(!rect)rect=card.getBoundingClientRect();
    const x=clamp((e.clientX-rect.left)/rect.width-.5,-.5,.5),y=clamp((e.clientY-rect.top)/rect.height-.5,-.5,.5);
    Object.assign(target,{x,y,scale:PRESS_MOTION.scale,shadowX:-x*20,shadowY:-y*20,blur:30,opacity:.25});start();
  }
  card.addEventListener('pointerenter',e=>{if(!fine.matches||MOTION.reduced)return;rect=card.getBoundingClientRect();active=true;card.classList.add('is-tilting');point(e);});
  card.addEventListener('pointermove',e=>{if(active)point(e);},{passive:true});
  const leave=()=>{active=false;rect=null;Object.assign(target,neutralPress());start();};
  card.addEventListener('pointerleave',leave);card.addEventListener('pointercancel',leave);
}

const THEME_KEY='aml-color-theme';
function applyTheme(theme,persist){
  state.theme=theme;
  document.documentElement.dataset.theme=theme;
  document.documentElement.style.colorScheme=theme;
  const toggle=$('themeToggle'),dark=theme==='dark';
  toggle.setAttribute('aria-checked',String(dark));
  toggle.setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
  if(persist!==false){try{localStorage.setItem(THEME_KEY,theme);}catch(e){}}
}
let themeTransitioning=false;
function toggleTheme(){
  if(themeTransitioning)return;
  const toggle=$('themeToggle'),next=state.theme==='dark'?'light':'dark';
  const direct=()=>applyTheme(next,true);
  if(MOTION.reduced||typeof document.startViewTransition!=='function'){direct();return;}
  const r=toggle.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  themeTransitioning=true;toggle.disabled=true;
  const transition=document.startViewTransition(direct);
  transition.ready.then(()=>document.documentElement.animate(
    {clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+radius+'px at '+x+'px '+y+'px)']},
    {duration:720,easing:'cubic-bezier(.22,.72,.2,1)',pseudoElement:'::view-transition-new(root)'}
  )).catch(()=>{});
  transition.finished.finally(()=>{themeTransitioning=false;toggle.disabled=false;});
}

function init(){
  /* 把 k 与归位偏移注入 CSS，保证 CSS 终态与 JS 关键帧算出的终态严格一致 */
  document.documentElement.style.setProperty('--mini-k',String(K));
  document.documentElement.style.setProperty('--mini-top',GEO.MINI_TOP+'px');
  syncMiniX();
  /* 探测 backdrop-filter 是否吃 url() 滤镜。CSS @supports 对 url() 的判定不可靠，
     所以写进真实元素再读回计算值 —— 只有真正被保留下来才启用位移折射。 */
  try{
    const t=document.createElement('div');
    t.style.backdropFilter='blur(2px) url(#lgWarp)';
    if(t.style.backdropFilter.includes('url'))document.documentElement.classList.add('warp-ok');
  }catch(e){}
  buildDom(); paintFunnel();

  /* 自定义日期弹层：原生 date 的系统弹层无法承载页面的磨砂玻璃材质。 */
  const dFrom=$('dateFrom'), dTo=$('dateTo'), calendars=[];
  const dateText=iso=>iso.replace(/-/g,'/');
  const monthText=ym=>{const p=ym.split('-');return p[0]+'年'+p[1]+'月';};
  const localToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
  const monthShift=(ym,delta)=>{const p=ym.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1+delta,1));return d.toISOString().slice(0,7);};
  const syncDateButtons=()=>{
    dFrom.querySelector('.date-value').textContent=dateText(state.from);
    dTo.querySelector('.date-value').textContent=dateText(state.to);
  };
  function closeCalendars(except){
    calendars.forEach(c=>{if(c!==except){c.pop.removeAttribute('data-open');c.trigger.setAttribute('aria-expanded','false');}});
  }
  function commitDate(kind,iso){
    let a=kind==='from'?iso:state.from, b=kind==='to'?iso:state.to;
    if(a>b){const t=a;a=b;b=t;}
    state.from=a;state.to=b;syncDateButtons();
    calendars.forEach(c=>{c.pending=state[c.kind];c.render();});closeCalendars();onFilter();
  }
  function makeCalendar(kind,trigger,pop){
    const cal={kind,trigger,pop,view:state[kind].slice(0,7),pending:state[kind],render:null,position:null};
    cal.position=()=>{
      pop.style.left='';pop.style.right='';
      const anchor=trigger.getBoundingClientRect(), picker=trigger.parentElement.getBoundingClientRect();
      const width=pop.offsetWidth, margin=12;
      const ideal=kind==='to'?anchor.right-width:anchor.left;
      const x=Math.max(margin,Math.min(ideal,innerWidth-width-margin));
      pop.style.left=(x-picker.left)+'px';pop.style.right='auto';
    };
    cal.render=()=>{
      const parts=cal.view.split('-').map(Number), y=parts[0], m=parts[1];
      const head=el('div','calendar-head'), title=el('div','calendar-title',monthText(cal.view));
      const nav=el('div','calendar-nav');
      const prev=el('button'),next=el('button');prev.type=next.type='button';
      prev.setAttribute('aria-label','上个月');next.setAttribute('aria-label','下个月');
      prev.append(icon('left'));next.append(icon('right'));
      prev.disabled=cal.view<=CAL_MIN.slice(0,7);next.disabled=cal.view>=CAL_MAX.slice(0,7);
      prev.addEventListener('click',()=>{cal.view=monthShift(cal.view,-1);cal.render();});
      next.addEventListener('click',()=>{cal.view=monthShift(cal.view,1);cal.render();});
      nav.append(prev,el('span','calendar-nav-label','月'),next);head.append(title,nav);

      const grid=el('div','calendar-grid');grid.setAttribute('role','grid');
      ['日','一','二','三','四','五','六'].forEach(w=>{const n=el('div','calendar-weekday',w);n.setAttribute('role','columnheader');grid.append(n);});
      const first=new Date(Date.UTC(y,m-1,1)), start=1-first.getUTCDay();
      for(let i=0;i<42;i++){
        const d=new Date(Date.UTC(y,m-1,start+i)),iso=d.toISOString().slice(0,10), outside=d.getUTCMonth()!==m-1;
        const b=el('button','calendar-day'+(outside?' is-outside':''),String(d.getUTCDate()));b.type='button';
        b.disabled=iso<CAL_MIN||iso>CAL_MAX;b.setAttribute('aria-selected',String(iso===cal.pending));
        b.tabIndex=iso===cal.pending?0:-1;
        b.setAttribute('aria-label',d.getUTCFullYear()+'年'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日');
        b.addEventListener('click',()=>{
          cal.pending=iso;if(outside)cal.view=iso.slice(0,7);cal.render();
          requestAnimationFrame(()=>{const selected=pop.querySelector('[aria-selected="true"]');if(selected)selected.focus();});
        });grid.append(b);
      }
      grid.addEventListener('keydown',e=>{
        const days=[...grid.querySelectorAll('.calendar-day')], current=days.indexOf(document.activeElement);
        const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
        if(current<0||step===undefined)return;
        e.preventDefault();let next=current+step;
        while(days[next]&&days[next].disabled)next+=step>0?1:-1;
        if(days[next])days[next].focus();
      });
      const actions=el('div','calendar-actions');
      const today=el('button','','今天'),confirm=el('button','','确定');today.type=confirm.type='button';
      const now=localToday();today.disabled=now<CAL_MIN||now>CAL_MAX;today.addEventListener('click',()=>commitDate(kind,now));
      confirm.addEventListener('click',()=>commitDate(kind,cal.pending));
      actions.append(today,confirm);pop.replaceChildren(head,grid,actions);
    };
    trigger.addEventListener('click',()=>{
      const open=pop.hasAttribute('data-open');closeCalendars(open?null:cal);
      $('gameMenu').removeAttribute('data-open');$('gameTrigger').setAttribute('aria-expanded','false');
      if(open){pop.removeAttribute('data-open');trigger.setAttribute('aria-expanded','false');return;}
      cal.pending=state[kind];cal.view=cal.pending.slice(0,7);cal.render();cal.position();pop.setAttribute('data-open','');trigger.setAttribute('aria-expanded','true');
      requestAnimationFrame(()=>{const selected=pop.querySelector('[aria-selected="true"]');if(selected)selected.focus();});
    });
    calendars.push(cal);cal.render();return cal;
  }
  makeCalendar('from',dFrom,$('dateFromPopover'));
  makeCalendar('to',dTo,$('dateToPopover'));
  syncDateButtons();

  /* 游戏筛选：原生 select 放不了图标，用自定义 listbox */
  const gm=$('gameMenu'), gt=$('gameTrigger'), gtb=$('gameTriggerBody');
  const gameOpts=[['all','全部游戏',null]].concat(GAMES.map(g=>[g[0],g[0],g[3]]));
  function gameBody(v){
    const o=gameOpts.find(x=>x[0]===v);
    const w=el('span','game-opt');
    if(o[2]){
      const img=el('img','game-icon'); img.src='icons/'+o[2]; img.alt='';
      img.addEventListener('error',()=>{const fb=el('span','game-fallback',o[1][0]);img.replaceWith(fb);});
      w.append(img);
    }
    w.append(el('span','',o[1]));
    return w;
  }
  gameOpts.forEach(o=>{
    const b=el('button'); b.type='button'; b.setAttribute('role','option');
    b.dataset.v=o[0]; b.append(gameBody(o[0]));
    b.addEventListener('click',()=>{
      state.game=o[0]; gtb.replaceChildren(gameBody(o[0]));
      gm.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.v===o[0])));
      gm.removeAttribute('data-open'); gt.setAttribute('aria-expanded','false'); onFilter();
    });
    gm.append(b);
  });
  gtb.replaceChildren(gameBody('all'));
  gm.querySelector('button').setAttribute('aria-selected','true');
  gt.addEventListener('click',()=>{
    const open=gm.hasAttribute('data-open');
    closeCalendars();
    open?gm.removeAttribute('data-open'):gm.setAttribute('data-open','');
    gt.setAttribute('aria-expanded',String(!open));
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.game-picker')){gm.removeAttribute('data-open');gt.setAttribute('aria-expanded','false');}
    /* 日期按钮与月份箭头会在 click 处理器中同步重绘并脱离 DOM。
       用事件原始路径判断，避免重绘后的 detached target 被误判为点到了弹层外。 */
    const path=typeof e.composedPath==='function'?e.composedPath():[e.target];
    if(!path.some(n=>n&&n.classList&&n.classList.contains('date-picker')))closeCalendars();
  });

  $('resetFilters').addEventListener('click',()=>{
    state.game='all';state.from=DEFAULT_FROM;state.to=DEFAULT_TO;state.reason='all';state.query='';
    state.pick='top';state.pickQuery='';
    syncDateButtons();calendars.forEach(c=>{c.pending=state[c.kind];c.view=c.pending.slice(0,7);c.render();});closeCalendars();gtb.replaceChildren(gameBody('all'));
    gm.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.v==='all')));
    onFilter();
  });

  /* 层分离开关 */
  $('splitToggle').addEventListener('click',()=>setSplit(!state.split));
  /* 快速最大化：mini 态下一键回到大漏斗（等价于点掉当前选中） */
  $('maximizeBtn').addEventListener('click',()=>{ if(state.mode==='mini')setMode('full'); });

  /* 命中层：单一委托，同时驱动 hover 视觉与点击下钻 */
  const hl=$('hitLayer'), stage=$('funnelStage');
  const setHot=(kind,key)=>{
    stage.classList.add('any-hot');
    shapeEls.forEach((sh,i)=>{
      const on=kind==='layer'&&+key===i;
      sh.parentNode.classList.toggle('is-hot',on);
      labelEls[i].classList.toggle('is-hot',on);
    });
    Object.keys(branchEls).forEach(b=>branchEls[b].classList.toggle('is-hot',kind==='branch'&&b===key));
  };
  const clearHot=()=>{
    stage.classList.remove('any-hot');
    shapeEls.forEach((sh,i)=>{sh.parentNode.classList.remove('is-hot');labelEls[i].classList.remove('is-hot');});
    Object.keys(branchEls).forEach(b=>branchEls[b].classList.remove('is-hot'));
  };
  const hotFrom=t=>{const b=t.closest('.hit');if(!b)return;setHot(b.dataset.kind,b.dataset.kind==='layer'?b.dataset.i:b.dataset.b);};
  hl.addEventListener('pointerover',e=>hotFrom(e.target));
  hl.addEventListener('focusin',e=>hotFrom(e.target));
  hl.addEventListener('pointerout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest('.hit'))clearHot();});
  hl.addEventListener('focusout',clearHot);
  hl.addEventListener('click',e=>{
    const b=e.target.closest('.hit'); if(!b||state.busy)return;
    const sel=b.dataset.kind==='layer'?{kind:'layer',i:+b.dataset.i}:{kind:'branch',b:b.dataset.b};
    const same=state.sel&&state.sel.kind===sel.kind&&(sel.kind==='layer'?state.sel.i===sel.i:state.sel.b===sel.b);
    if(same&&state.mode==='mini'){ setMode('full'); return; }
    select(sel);
  });

  /* 导航 */
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setNav(b.dataset.nav)));
  $('navLanguageToggle').addEventListener('click',()=>{state.navLang=state.navLang==='zh'?'en':'zh';syncNavLanguage();});
  $('themeToggle').addEventListener('click',toggleTheme);
  syncNavLanguage();
  applyTheme(state.theme,false);
  document.addEventListener('click',e=>{
    if(state.nav!=='dashboard'||!state.dashSelected)return;
    const path=typeof e.composedPath==='function'?e.composedPath():[e.target];
    const inside=path.some(n=>n&&n.classList&&(n.classList.contains('dash-kpi')||n.classList.contains('metric-card')));
    if(!inside){state.dashSelected=null;document.querySelectorAll('.dash-kpi').forEach(n=>n.setAttribute('aria-pressed','false'));document.querySelectorAll('.metric-card').forEach(n=>n.classList.remove('is-selected'));}
  });
  document.querySelectorAll('.role-tab').forEach(b=>b.addEventListener('click',()=>{
    state.feedbackRole=b.dataset.role;
    document.querySelectorAll('.role-tab').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',String(on));});
    renderFeedback();
  }));
  $('restoreDemo').addEventListener('click',()=>{
    if(!confirm('恢复固定种子演示数据？所有本地反馈、决定和改版任务都会被清除。'))return;
    try{localStorage.removeItem(STORE_KEY);}catch(e){}
    location.reload();
  });

  /* 页脚常驻的自洽校验 chip */
  document.querySelectorAll('.close-dialog').forEach(b=>b.addEventListener('click',e=>e.target.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
  $('sidePanel').addEventListener('click',e=>{
    const c=e.target.closest('[data-open]'); if(c)openMaterial(c.dataset.open);
  });

  /* 跟踪页控件 */
  $('trackSearch').addEventListener('input',e=>{state.trkQuery=e.target.value;state.trkPage=1;renderTrack();});
  ['trkStage','trkBranch','trkRevised','trkSort'].forEach(id=>
    $(id).addEventListener('change',e=>{state[id]=e.target.value;state.trkPage=1;renderTrack();}));
  $('trkPrev').addEventListener('click',()=>{if(state.trkPage>1){state.trkPage--;renderTrack();}});
  $('trkNext').addEventListener('click',()=>{state.trkPage++;renderTrack();});
  $('trackExport').addEventListener('click',()=>exportCSV(trackList(),'素材跟踪台账'));

  /* Esc 优先关闭选择弹层，再收起 mini 态 */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&(gm.hasAttribute('data-open')||calendars.some(c=>c.pop.hasAttribute('data-open')))){
      e.preventDefault();
      const openCal=calendars.find(c=>c.pop.hasAttribute('data-open'));
      gm.removeAttribute('data-open');gt.setAttribute('aria-expanded','false');closeCalendars();
      (openCal?openCal.trigger:gt).focus();return;
    }
    if(e.key==='Escape'&&state.mode==='mini'&&!document.querySelector('dialog[open]')){
      e.preventDefault(); setMode('full');
    }
  });

  /* 引导线随布局变化重算（只重算 d，不重放生长） */
  addEventListener('resize',()=>{
    applyCols(state.mode==='mini');snapHits();requestSelectionLink();
    calendars.filter(c=>c.pop.hasAttribute('data-open')).forEach(c=>c.position());
  },{passive:true});

  Tilt.init();
  setColumns(false);
  renderSide();
  hydrateIcons();
  if(!DATA_OK)toast('数据自洽校验未通过，请查看控制台');
}

function onFilter(){
  state.page=1; state.reason='all'; state.trkPage=1; state.peekId=null;
  /* 筛选会改层宽，而层宽变化不可插值（d 属性），所以先把飞行中的动画落位 */
  if(state.busy){ TL.geo&&TL.geo.finish(); TL.card&&TL.card.finish(); }
  renderAll();
}

let booted=false;
const boot=()=>{ if(booted)return; booted=true; init(); };
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading')boot();

/* 调试出口 */
window.MuseLab={
  DATA,state,counts,geom:()=>geom,setMode,setSplit,select,
  dashboard:()=>({rows:paidRows(base()),totals:sumRows(paidRows(base())),charts:{...state.dashCharts}}),
  feedbackEvents,revisionTasks,checks:runtimeChecks,
  restoreDemo:()=>{try{localStorage.removeItem(STORE_KEY);}catch(e){}location.reload();}
};
})();
</script>
</body>
</html>
