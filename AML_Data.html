<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.20/latin-600.css');

/* ============ [0] 设计令牌 ============ */
:root{
  /* 主链路五级明度阶梯：同色相 ~218°，明度由浅到深 = 样本逐层浓缩、确定性递增 */
  --f1:#E3EDFB; --f2:#A8C4EE; --f3:#6E9BDD; --f4:#3D6CBF; --f5:#22458A;
  --f1-s:#C3D8F4; --f2-s:#8DAFE4; --f3-s:#4F80CC; --f4-s:#2C55A3; --f5-s:#1A3670;
  --f1-h:#9CBEEC; --f2-h:#6B96D8; --f3-h:#3D72C4; --f4-h:#21489B; --f5-h:#122A5C;
  --ink-light:#12243D;  /* L1-L3 用 */
  --ink-dark:#FFFFFF;   /* L4-L5 用 */
  /* 选中反相色：比 --f5 更暗且去饱和，确保在五级色阶的任何一端都是跳变而非同族 */
  --ink-invert:#0F182C;

  /* 分支：统一低饱和暖色（~38°），饱和度压到 25-35%，永远退到蓝色之后 */
  --br-fill:#F6F1E7; --br-stroke:#DCCDB2; --br-ink:#7A6136;
  --br-fill-hover:#EFE4CF; --br-fill-active:#EBDFC6; --br-ink-active:#6B5329;
  --br-accent:#B98A3E; --br-line:#D9C9AC;

  /* 中性 */
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#20252E;
  --ink-2:#6F7889; --ink-3:#9AA3B2; --line:#E9ECF1; --line-2:#F1F3F7;

  --radius:18px; --radius-sm:12px;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif;
  --num:Manrope,var(--sans);

  --ease-out:cubic-bezier(.2,.8,.3,1);
  --ease-split:cubic-bezier(.3,.9,.25,1);
  /* 预采样真实阻尼弹簧 m=1 k=210 c=20，ζ≈0.69，沉降 530ms，过冲 4.8%。末值必须硬写 1 */
  --ease-spring:linear(0,0.1028,0.3184,0.5501,0.7472,0.8909,0.9818,1.0301,1.0483,1.0485,1.0396,1.0280,1.0171,1.0086,1.0028,1);

  --col-funnel:817px; --col-side:minmax(320px,1fr); --slot-h:542px;
  /* 由 JS 从 GEO 注入，避免 CSS 与 JS 里的常数漂移 */
  --mini-k:.5217391; --mini-top:8px; --mini-x:-62.6px;
}

/* ============ [1] reset + 基础排版 ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:disabled{cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[role=switch]:focus-visible{outline:3px solid #7399E6;outline-offset:3px;border-radius:6px}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-weight:600}
svg{vertical-align:middle;display:block}
[data-icon]{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
[data-icon] svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============ [1.5] Liquid Glass（iOS 26 材质） ============
   真正让人读成「液态玻璃」的是四层叠加，缺任何一层都会退化成普通毛玻璃：
   ① 背景折射   backdrop-filter: blur + saturate + brightness
                 —— saturate 是关键：它把背后的低饱和色放大成可见的彩色，玻璃才"活"
   ② 本体色调   斜向白色渐变，模拟玻璃自身厚度对光的衰减
   ③ 边缘透镜   多层 inset 白光 + 内发光 —— 玻璃的「厚度感」几乎全部来自这里
   ④ 色散镜边   1.2px 的冷暖渐变描边（mask-composite 挖空），玻璃边把光劈成两端
   依据：HIG Materials 规定材质只用于控件/导航层，不进内容层；
   文字用 vibrancy 等价处理（提对比、加字重、不用平灰）。 */
/* ⚠ 嵌套陷阱：带 backdrop-filter 的元素会成为 Backdrop Root，
   它内部的玻璃子元素就只能采样到父元素自己的底色 → 折射源被切断、彻底变平。
   所以承载层（顶栏、筛选栏）只用 .lg-flat（玻璃外观，无 backdrop-filter），
   真正需要折射的控件（下拉、导航、开关、日期 chip）才用 .lg。
   环境色团本身已被 blur(90px)，所以 .lg-flat 靠 alpha 混合就能得到等价观感。 */
.lg,.lg-flat{position:relative;isolation:isolate;
  background:linear-gradient(138deg,rgba(255,255,255,.66),rgba(255,255,255,.30) 46%,rgba(255,255,255,.54));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,255,255,.62),
    inset 1px 0 0 rgba(255,255,255,.58),
    inset -1px 0 0 rgba(255,255,255,.58),
    inset 0 0 20px rgba(255,255,255,.44),
    0 1px 2px rgba(28,52,96,.05),
    0 10px 28px -10px rgba(28,52,96,.20);
}
.lg{-webkit-backdrop-filter:blur(22px) saturate(205%) brightness(1.13);
  backdrop-filter:blur(22px) saturate(205%) brightness(1.13)}
/* ② 高光：两个错位的径向渐变 = 光源在左上、地面反光在右下 */
.lg::before,.lg-flat::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(130% 82% at 16% -6%,rgba(255,255,255,.82),transparent 56%),
    radial-gradient(96% 74% at 90% 106%,rgba(255,255,255,.46),transparent 60%);
  mix-blend-mode:screen}
/* ④ 色散镜边 */
.lg::after,.lg-flat::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.2px;
  background:linear-gradient(132deg,rgba(255,255,255,1),rgba(150,195,255,.62) 26%,rgba(255,255,255,.14) 50%,
    rgba(255,214,186,.52) 74%,rgba(255,255,255,.98));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.lg>*,.lg-flat>*{position:relative;z-index:1}

/* 支持 backdrop-filter: url() 时接一个位移贴图 —— 这才是「液态」那一下真正的折射扰动。
   由 JS 特性探测后给 html 加 .warp-ok；Safari 不支持时自动停在上面四层，不降级出 bug。 */
.warp-ok .lg-pop{
  -webkit-backdrop-filter:blur(19px) saturate(205%) brightness(1.13) url(#lgWarp);
  backdrop-filter:blur(19px) saturate(205%) brightness(1.13) url(#lgWarp)}

/* 圆角家族：药丸用 999px，面板用连续大圆角 */
.lg-pop{border-radius:20px}
.lg-bar{border-radius:16px}
.lg-chip{border-radius:10px}
.lg-nav{border-radius:999px}

/* 环境色团：玻璃必须有东西可折射。三团极低不透明度的冷暖色，
   肉眼在白底上几乎看不见，但被 saturate(205%) 放大后在玻璃里清晰可辨。 */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
.ambient i:nth-child(1){width:620px;height:620px;left:-120px;top:-160px;background:rgba(61,108,191,.16)}
.ambient i:nth-child(2){width:520px;height:520px;right:4%;top:40px;background:rgba(185,138,62,.13)}
.ambient i:nth-child(3){width:700px;height:700px;left:38%;top:44%;background:rgba(110,155,221,.13)}
body>.topbar,body>main{position:relative;z-index:1}

/* ============ [2] 骨架 ============ */
/* 横排顶栏：左 logo + 右三栏目。无侧栏，主区获得全部横向宽度 */
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 30px;border-bottom:1px solid var(--line);
  /* 不能用 backdrop-filter —— 它会成为 Backdrop Root，把里面导航玻璃的折射源切断 */
  background:rgba(255,255,255,.62);position:sticky;top:0;z-index:15}
.brand{display:flex;align-items:center;gap:12px;font-size:16.5px;font-weight:700;letter-spacing:0;white-space:nowrap}
.brand-mark{width:36px;height:36px;border-radius:32%;background:#0F1011;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:0;flex-shrink:0}
.brand small{display:block;font-size:8.5px;font-weight:500;letter-spacing:1.6px;color:var(--ink-3);margin-top:3px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:22px;min-width:0}
.top-nav{display:flex;align-items:stretch;gap:24px;padding:0;background:transparent!important;box-shadow:none!important;
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;isolation:auto;border-radius:0}
.top-nav::before,.top-nav::after{display:none}
.nav-item{position:relative;padding:8px 0 13px;border-radius:0;font-size:14px;color:#5F6368;min-height:42px;
  display:flex;align-items:center;white-space:nowrap;font-weight:500;
  transition:color 160ms linear,font-weight 160ms linear}
.nav-item::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:1px;background:#0A0A0A;
  transform:scaleX(0);transform-origin:center;transition:transform 180ms var(--ease-out)}
.nav-item:hover:not(:disabled):not(.active){color:#20252E}
.nav-item.active{color:#0A0A0A;font-weight:700;background:transparent;box-shadow:none}
.nav-item.active::after{transform:scaleX(1)}
.nav-item:disabled{opacity:.42}
.lang-toggle{height:36px;min-width:72px;padding:0 14px;border:1px solid #E1E5EC;border-radius:999px;background:rgba(255,255,255,.78);
  color:#30343B;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 8px 18px -16px rgba(28,52,96,.42);
  transition:border-color 150ms linear,background 150ms linear,color 150ms linear,box-shadow 150ms linear,transform 120ms var(--ease-out)}
.lang-toggle:hover{border-color:#AFC7EA;background:#F6F9FE;color:var(--f5);box-shadow:inset 0 1px 0 #fff,0 9px 20px -14px rgba(34,69,138,.42)}
.lang-toggle:active{transform:scale(.96)}
.lang-toggle:focus-visible{outline:0;border-color:#2F6FEB;box-shadow:0 0 0 3px rgba(47,111,235,.15)}
.theme-toggle{position:relative;width:54px;height:32px;padding:0 5px;border:1px solid #E1E5EC;border-radius:999px;
  background:rgba(255,255,255,.78);display:flex;align-items:center;justify-content:space-between;color:#8B95A5;
  box-shadow:inset 0 1px 2px rgba(28,52,96,.08),0 8px 18px -16px rgba(28,52,96,.42);
  transition:background 260ms ease,border-color 260ms ease,color 260ms ease,box-shadow 260ms ease}
.theme-toggle [data-icon]{position:relative;z-index:2;width:18px;height:18px;pointer-events:none;transition:color 240ms ease,transform 340ms var(--ease-spring)}
.theme-toggle [data-icon] svg{width:14px;height:14px;stroke-width:1.8}
.theme-knob{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;z-index:1;background:#fff;
  box-shadow:0 2px 7px rgba(28,52,96,.24),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform 420ms var(--ease-spring),background 260ms ease,box-shadow 260ms ease}
.theme-toggle [data-icon=sun]{color:#D58A20}.theme-toggle [data-icon=moon]{color:#8691A2}
.theme-toggle:hover .theme-knob{box-shadow:0 3px 10px rgba(28,52,96,.30),inset 0 1px 0 #fff}
.theme-toggle[aria-checked=true]{background:#242A35;border-color:#343D4B;color:#AEB8C7;box-shadow:inset 0 1px 3px rgba(0,0,0,.38)}
.theme-toggle[aria-checked=true] .theme-knob{transform:translateX(24px);background:#111720;box-shadow:0 2px 8px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08)}
.theme-toggle[aria-checked=true] [data-icon=moon]{color:#C8D7F0;transform:rotate(-9deg) scale(1.06)}
.theme-toggle[aria-checked=true] [data-icon=sun]{color:#697486;transform:rotate(70deg) scale(.86)}
.theme-toggle:focus-visible{outline:0;border-color:#6E9BDD;box-shadow:0 0 0 3px rgba(47,111,235,.16)}
.icon-button{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background 150ms linear}
.icon-button:hover:not(:disabled){background:#EEF1F6;color:var(--ink)}
main{padding:26px 30px 40px}
.page-heading{margin-bottom:20px}
.page-heading h1{font-size:27px;letter-spacing:-.7px}
.page-heading p{font-size:12.5px;color:var(--ink-2);margin-top:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px}
.panel-heading h2{font-size:17px;letter-spacing:-.3px}
.panel-heading p{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.panel-heading p.caliber-strong{font-size:12px;font-weight:700;color:var(--ink)}
.heading-inline{display:flex;align-items:center;gap:9px}
.count-bubble{font-family:var(--num);font-size:11px;background:#EAF0FD;color:var(--f4);padding:2px 8px;border-radius:7px}
.text-button{font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;transition:background 150ms linear,color 150ms linear}
.text-button:hover{background:#EEF1F6;color:var(--ink)}
.outline-button{font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;transition:border-color 150ms linear,color 150ms linear,background 150ms linear}
.outline-button:hover{border-color:#C3D8F4;color:var(--f4);background:#F7FAFF}
.panel-actions{display:flex;align-items:flex-start;gap:8px;flex-shrink:0;overflow:visible}
.download-button{position:relative;width:76px;height:34px;margin:0 0 28px;border:0;border-radius:9px;background:transparent;color:#fff;
  font-size:11.5px;font-weight:700;cursor:pointer;overflow:visible;isolation:isolate;z-index:2}
.download-button .docs,.download-button .download{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:9px}
.download-button .docs{gap:6px;z-index:2;background:linear-gradient(145deg,#24344F,#17243A);border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform 220ms var(--ease-out),box-shadow 220ms linear}
.download-button .download{left:6px;right:6px;z-index:1;color:#fff;background:linear-gradient(145deg,#4B8CF5,#2F6FEB);
  border:1px solid rgba(34,69,138,.16);box-shadow:0 8px 16px -10px rgba(34,69,138,.68);
  transform:translateY(0);transition:transform 360ms cubic-bezier(.77,0,.175,1)}
.download-button .download [data-icon]{animation:downloadBounce 900ms ease-in-out infinite}
.download-button:hover .docs{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 22px -15px rgba(15,24,44,.78)}
.download-button:hover .download,.download-button:focus-visible .download{transform:translateY(30px)}
.download-button:focus-visible{outline:0}.download-button:focus-visible .docs{box-shadow:0 0 0 3px rgba(47,111,235,.18)}
@keyframes downloadBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.primary-button{background:var(--f4);color:#fff;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:10px;transition:background 150ms linear}
.primary-button:hover:not(:disabled){background:var(--f5)}
.primary-button:disabled{opacity:.4}

/* ============ [3] 筛选栏与指标卡 ============ */
/* ⚠ .lg-flat 带 isolation:isolate → 下拉菜单的 z-index:30 被关在筛选栏内部，
   必须给筛选栏本身一个 z-index 才能整体浮到漏斗面板之上。
   取 12（< topbar 的 15），否则滚动时筛选栏会盖住吸顶的顶栏。 */
.filters{display:flex;align-items:center;gap:14px;padding:10px 15px;margin-bottom:16px;flex-wrap:wrap;z-index:12;
  background:linear-gradient(138deg,rgba(255,255,255,.86),rgba(246,249,255,.72) 46%,rgba(255,255,255,.82));
  -webkit-backdrop-filter:blur(26px) saturate(168%) brightness(1.06);
  backdrop-filter:blur(26px) saturate(168%) brightness(1.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(255,255,255,.68),
    inset 0 0 24px rgba(255,255,255,.38),0 12px 34px -18px rgba(28,52,96,.28)}
.filters::after{background:linear-gradient(132deg,rgba(255,255,255,1),rgba(196,216,246,.48) 32%,
  rgba(255,255,255,.30) 56%,rgba(255,255,255,.94))}
/* 先 icon 后文字 */
.filter-field{display:flex;align-items:center;gap:7px}
.field-icon{color:var(--ink-2);display:inline-flex}
.field-icon svg{width:16px;height:16px}
.filter-field label{font-size:11px;color:var(--ink-2);letter-spacing:.3px;font-weight:500}
.filter-divider{width:1px;height:20px;background:rgba(28,52,96,.10)}
.filter-reset{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.filter-reset:hover{background:rgba(255,255,255,.7);color:var(--ink)}
/* 交付日期：自绘可访问日历，原生日历弹层无法应用产品的玻璃材质 */
.date-range{display:flex;align-items:center;gap:7px}
.date-dash{color:var(--ink-3);font-size:12px}
.date-picker{position:relative}
.date-trigger{min-width:122px;height:32px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:0;font-family:var(--num);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.date-trigger [data-icon]{color:var(--ink-3)}
.date-trigger [data-icon] svg{width:14px;height:14px}
.date-trigger::after{padding:1px;background:#8AB4F8}
.date-trigger[aria-expanded=true]::after{background:#2F6FEB}
.date-trigger[aria-expanded=true]{box-shadow:inset 0 0 0 1px rgba(61,108,191,.24),0 6px 16px -8px rgba(28,52,96,.25)}
.date-popover{position:absolute;top:calc(100% + 10px);left:0;width:min(310px,calc(100vw - 32px));padding:14px;z-index:34;
  visibility:hidden;pointer-events:none;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;
  background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(241,247,255,.80));
  -webkit-backdrop-filter:blur(24px) saturate(185%) brightness(1.08);backdrop-filter:blur(24px) saturate(185%) brightness(1.08);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.70),inset 0 0 28px rgba(255,255,255,.42),
    0 20px 48px -22px rgba(25,44,78,.38);
  transition:opacity 200ms cubic-bezier(.23,1,.32,1),transform 200ms cubic-bezier(.23,1,.32,1),visibility 0s linear 200ms}
.date-picker:last-child .date-popover{left:auto;right:0;transform-origin:top right}
.date-popover[data-open]{visibility:visible;pointer-events:auto;opacity:1;transform:none;transition-delay:0s}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.calendar-title{font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink)}
.calendar-nav{display:flex;align-items:center;gap:4px}
.calendar-nav-label{min-width:22px;text-align:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.calendar-nav button{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background 150ms ease,color 150ms ease,transform 140ms cubic-bezier(.23,1,.32,1)}
.calendar-nav button:disabled{opacity:.28}
.calendar-nav button:active:not(:disabled){transform:scale(.94)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calendar-weekday{height:25px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.calendar-day{aspect-ratio:1;min-width:0;border-radius:9px;font-family:var(--num);font-size:12px;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;transition:background 140ms ease,color 140ms ease,transform 140ms cubic-bezier(.23,1,.32,1)}
.calendar-day.is-outside{color:#B6BDCA}
.calendar-day:disabled{opacity:.26;cursor:not-allowed}
.calendar-day[aria-selected=true]{background:var(--f4);color:#fff;font-weight:700;box-shadow:0 4px 12px -6px rgba(34,69,138,.55)}
.calendar-day:active:not(:disabled){transform:scale(.92)}
.calendar-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(28,52,96,.08)}
.calendar-actions button{padding:6px 8px;border-radius:8px;color:var(--f4);font-size:11.5px;font-weight:600;transition:background 150ms ease}
.game-opt{display:flex;align-items:center;gap:8px}
.game-icon{width:22px;height:22px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#EEF1F6}
.game-fallback{width:22px;height:22px;border-radius:6px;background:#DCE5F5;color:var(--f4);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
/* 自定义游戏选择器（原生 select 无法放图标） */
.game-picker{position:relative}
.game-trigger{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:10px;font-size:12.5px;font-weight:600;transition:background 150ms linear}
.game-trigger:hover{background:rgba(255,255,255,.72)}
.game-menu{position:absolute;top:calc(100% + 9px);left:-6px;min-width:218px;padding:7px;z-index:30;
  visibility:hidden;pointer-events:none;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;
  background:linear-gradient(145deg,rgba(255,255,255,.975),rgba(246,249,254,.94));
  -webkit-backdrop-filter:blur(32px) saturate(145%);backdrop-filter:blur(32px) saturate(145%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.72),0 18px 44px -22px rgba(25,44,78,.38);
  transition:opacity 200ms cubic-bezier(.23,1,.32,1),transform 200ms cubic-bezier(.23,1,.32,1),visibility 0s linear 200ms}
.game-menu[data-open]{visibility:visible;pointer-events:auto;opacity:1;transform:none;transition-delay:0s}
.warp-ok .date-popover{-webkit-backdrop-filter:blur(24px) saturate(185%) brightness(1.08) url(#lgWarp);
  backdrop-filter:blur(24px) saturate(185%) brightness(1.08) url(#lgWarp)}
.warp-ok .game-menu{-webkit-backdrop-filter:blur(32px) saturate(145%) brightness(1.04) url(#lgWarp);
  backdrop-filter:blur(32px) saturate(145%) brightness(1.04) url(#lgWarp)}
.game-menu button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;
  font-size:12.5px;text-align:left;transition:background 150ms linear}
.game-menu button:hover{background:rgba(255,255,255,.62)}
.game-menu button[aria-selected=true]{color:var(--f5);font-weight:600;
  background:linear-gradient(140deg,rgba(255,255,255,.96),rgba(255,255,255,.72));
  box-shadow:0 1px 0 rgba(255,255,255,1) inset,0 2px 6px rgba(28,52,96,.10)}

/* ============ [4] 漏斗三层结构 ============ */
#workspace{display:grid;grid-template-columns:var(--col-funnel) var(--col-side);gap:20px;position:relative;align-items:start}
.selection-link{position:absolute;inset:0;width:100%;height:100%;z-index:4;overflow:visible;pointer-events:none;opacity:0;
  transition:opacity 180ms linear}
.selection-link.is-visible{opacity:1}
.selection-link-base{fill:none;stroke:rgba(61,108,191,.18);stroke-width:5;stroke-linecap:round}
.selection-link-flow{fill:none;stroke:var(--f4);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 9;
  animation:selectionFlow 900ms linear infinite}
.selection-link-dot{fill:var(--f5);stroke:#fff;stroke-width:2;filter:drop-shadow(0 2px 5px rgba(34,69,138,.34))}
@keyframes selectionFlow{to{stroke-dashoffset:-26}}
.funnel-panel{overflow:visible}
#funnelSlot{position:relative;height:var(--slot-h);margin:0 24px;contain:layout;
  transition:height 380ms var(--ease-split)}
/* 舞台是 700px 固有尺寸，槽位比它宽 → 居中；max() 兜住窄屏（配合 ≤700 的 overflow-x:auto） */
#funnelStage{position:absolute;left:max(0px,calc(50% - 350px));top:0;width:700px;height:740px;perspective:1200px}
#funnelStage.is-split{perspective:800px}
#workspace.mini-on #funnelStage{left:0}   /* mini 是左侧导轨，必须贴左 */
/* 绕中心旋转 —— 绕角点会把远端角的位移用力臂放大，看起来像"一角钉死、其他地方在甩" */
#tiltWrap{position:absolute;left:0;top:0;width:700px;height:740px;transform-origin:50% 50%;
  will-change:transform;backface-visibility:hidden}
/* transform-origin 永久钉在 0 0；不加 transition —— Genie 由 WAAPI 驱动 */
#geoWrap{position:absolute;left:0;top:0;width:700px;height:740px;transform-origin:0 0;will-change:transform;
  transform:translate(0px,0px) scale(1);transition:none}
/* mini 终态：--mini-x 把缩放后的最左边缘拉回 x=0，否则 CX_SOLO=350 会让迷你漏斗溢出 240px 导轨 */
#funnelStage.is-mini #geoWrap{transform:translate(var(--mini-x),var(--mini-top)) scale(var(--mini-k))}
#funnelGeo{width:700px;height:740px;overflow:visible}
#labelLayer{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#hitLayer{position:absolute;left:0;top:0;width:700px;height:740px}
.hit{position:absolute;border-radius:10px;color:transparent;font-size:1px;overflow:hidden}
/* 分离开关 */
.split-switch{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-2)}
/* 开关不能挂 .lg —— .lg::after 是镜边，而 ::after 在这里是滑块，会打架。单独写玻璃。 */
.switch{width:44px;height:26px;border-radius:999px;position:relative;flex-shrink:0;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(214,222,236,.62));
  -webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.5),
    inset 0 0 10px rgba(255,255,255,.35),0 1px 3px rgba(28,52,96,.12);
  transition:background 240ms linear,box-shadow 240ms linear;isolation:isolate}
.switch::before{content:'';position:absolute;left:10px;top:10px;width:7px;height:6px;border-radius:4px;background:rgba(255,255,255,.88);
  z-index:0;transition:left 220ms ease,width 220ms ease;transform-origin:left center}
.switch-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(120% 120% at 32% 22%,#fff,#F0F4FA);
  box-shadow:0 1px 3px rgba(28,52,96,.30),0 0 0 .5px rgba(28,52,96,.06),inset 0 1px 0 rgba(255,255,255,1);
  transition:transform 380ms var(--ease-spring);z-index:1;display:flex;align-items:center;justify-content:center}
.switch-thumb [data-icon]{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 180ms ease,transform 260ms var(--ease-spring)}
.switch-thumb [data-icon] svg{width:9px;height:9px;stroke-width:2.6}
.switch-cross{color:#89919D;opacity:1;transform:scale(1) rotate(0)}
.switch-check{color:var(--f4);opacity:0;transform:scale(0) rotate(-24deg)}
.switch[aria-checked=true]{background:linear-gradient(140deg,rgba(94,140,214,.85),rgba(45,86,166,.92));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.22),0 2px 6px rgba(28,52,96,.22)}
.switch[aria-checked=true]::before{left:27px}
.switch[aria-checked=true] .switch-thumb{transform:translateX(18px)}
.switch[aria-checked=true] .switch-cross{opacity:0;transform:scale(0) rotate(24deg)}
.switch[aria-checked=true] .switch-check{opacity:1;transform:scale(1) rotate(0)}
.switch.is-animating[aria-checked=true] .switch-thumb{animation:splitThumbOn 430ms both}
.switch.is-animating[aria-checked=false] .switch-thumb{animation:splitThumbOff 430ms both}
.switch.is-animating[aria-checked=true]::before{animation:splitTrailOn 360ms both}
.switch.is-animating[aria-checked=false]::before{animation:splitTrailOff 360ms both}
@keyframes splitThumbOn{0%{transform:translateX(0) scale(1)}45%{transform:translateX(20px) scale(.86,1.14)}72%{transform:translateX(16.5px) scale(1.07,.94)}100%{transform:translateX(18px) scale(1)}}
@keyframes splitThumbOff{0%{transform:translateX(18px) scale(1)}45%{transform:translateX(-2px) scale(.86,1.14)}72%{transform:translateX(1.5px) scale(1.07,.94)}100%{transform:translateX(0) scale(1)}}
@keyframes splitTrailOn{0%{left:10px;width:7px}48%{left:11px;width:23px}100%{left:27px;width:7px}}
@keyframes splitTrailOff{0%{left:27px;width:7px}48%{left:10px;width:23px}100%{left:10px;width:7px}}
/* mini 态的快速最大化按钮：与清单里的详情箭头完全同一套样式 */
.maximize-btn{margin-left:3px}
.maximize-btn[hidden]{display:none}

/* ============ [5] 层与分支视觉 ============ */
/* --lx 承担"两套中心"的水平切换，--ly 承担层分离，--peek-x 承担选中抽出。
   三者必须挤在同一个 translate 里 —— 分开写会互相覆盖（后写的赢）。
   d 属性不可插值，所以位移只能走 transform。 */
g.layer{transform:translate(calc(var(--lx,0px) + var(--peek-x,0px)),var(--ly,0px));
  transition:transform 380ms var(--ease-split);transition-delay:calc(var(--i) * 40ms)}
/* 无描边、无每层投影 —— 这是「参差不齐」的首要来源：
   圆角 + 1px 描边 + 独立投影会在接缝处叠出扇贝状豁口。
   整体投影交给 #tiltWrap 统一承担，五层靠色阶自身分隔。 */
path.layer-shape{stroke:none;stroke-width:0;transform-box:fill-box;transform-origin:center;will-change:transform,filter;
  transition:transform 160ms var(--ease-out),stroke 160ms linear,stroke-width 160ms linear}
#funnelStage.is-split #geoWrap,#funnelStage.is-split #labelLayer{transform-style:preserve-3d}
#funnelStage.is-split path.layer-shape{transition:stroke 160ms linear,stroke-width 160ms linear;
  filter:drop-shadow(0 1px 2px rgba(15,24,44,.15)) drop-shadow(0 4px 10px rgba(15,24,44,.10)) drop-shadow(0 12px 28px rgba(15,24,44,.07))}
g.gap-group{transform:translateY(var(--gy,0px));transition:transform 380ms var(--ease-split),opacity 260ms linear;
  transition-delay:calc(var(--i) * 40ms),0ms}
#funnelStage.is-mini.is-split g.gap-group{transform:translate(91px,var(--gy,0px))}
/* mini 态无论展开还是合并都不显示右侧分支框。
   不能把规则绑定在 .is-split 上，否则关闭开关的淡出过渡中分支框会先恢复不透明而闪现。 */
#funnelStage.is-mini g.branch,
#funnelStage.is-mini path.branch-stem{opacity:0!important;pointer-events:none}
#funnelStage.is-mini .hit[data-kind=branch]{display:none}
/* 标签只 translate、绝不 scale → 字形永远按真实 CSS px 栅格化。
   分离位移已烘进 --px/--py，因此 applyTf 会连带把它乘上 k，与几何层自动一致。
   两种模式的终态都写在 CSS 里，WAAPI 只驱动中间关键帧且 fill:'none'，
   动画结束后自然交回 CSS，无需 bake/cancel。 */
.layer-label{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;
  transform:translate(calc(var(--px,0px) + var(--peek-x,0px)),var(--py,0px));
  transition:transform 380ms var(--ease-split);transition-delay:calc(var(--i) * 40ms)}
#funnelStage.is-mini .layer-label{transform:translate(calc(var(--mx,0px) + var(--peek-x,0px)),var(--my,0px))}
/* 居中两行：中文在上、数字在下。字号在所有层完全一致 ——
   这正是「层高以最矮层为基准」的目的：最矮层 56px 恰好容下 12.5 + 26 + 留白。 */
.lbl-big,.lbl-mini{position:absolute;left:0;top:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;text-align:center;transform-origin:center;will-change:transform,filter;
  transition:transform 160ms var(--ease-out),filter 160ms linear}
#funnelStage.is-split .lbl-big,#funnelStage.is-split .lbl-mini{transition:none;transform-style:preserve-3d}
.lbl-big{width:var(--lw-full);height:var(--lh)}
.lbl-mini{width:var(--lw-mini);height:var(--lh-mini);opacity:0}
.lbl-big .nm{font-size:12.5px;font-weight:600;letter-spacing:-.1px;white-space:nowrap}
.lbl-big .num{font-family:var(--num);font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.05;white-space:nowrap}
.lbl-big .num i{font-style:normal;font-size:11.5px;font-weight:500;margin-left:3px;opacity:.72}
.lbl-mini .nm{font-size:11.5px;font-weight:600;white-space:nowrap}
.lbl-mini .num{font-family:var(--num);font-size:17px;font-weight:700;line-height:1.05}
.layer-label[data-i="0"],.layer-label[data-i="1"],.layer-label[data-i="2"]{color:var(--ink-light)}
.layer-label[data-i="3"],.layer-label[data-i="4"]{color:var(--ink-dark)}

/* hover：同辈减弱是比放大目标更有效的聚焦手段。
   层形状已无描边，所以 hover 改用亮度提升而不是换描边色 —— 否则会重新引入接缝豁口 */
#funnelStage.any-hot g.layer:not(.is-hot){opacity:.82}
#funnelStage.any-hot .layer-label:not(.is-hot){opacity:.82}
g.layer.is-hot path.layer-shape{filter:brightness(1.06) saturate(1.08)}

g.branch{transform:translateX(var(--peek-x,0px));transition:transform 220ms var(--ease-out)}
rect.branch-shape{fill:var(--br-fill);stroke:var(--br-stroke);stroke-width:1;
  transition:fill 160ms linear,stroke 160ms linear,stroke-width 160ms linear,transform 160ms var(--ease-out)}
g.branch.is-hot rect.branch-shape{fill:var(--br-fill-hover);stroke:var(--br-accent);stroke-width:1.6;transform:translateX(2px)}
g.branch.is-active rect.branch-shape{fill:var(--br-fill-active);stroke:var(--br-accent);stroke-width:1.8}
rect.branch-bar{fill:var(--br-accent);transform-box:fill-box;transform-origin:center;transform:scaleY(0);opacity:0;
  transition:transform 180ms var(--ease-out),opacity 140ms linear}
g.branch.is-hot rect.branch-bar,g.branch.is-active rect.branch-bar{transform:scaleY(1);opacity:1}
.branch-name{font-size:11.5px;font-weight:600;fill:var(--br-ink)}
.branch-num{font-family:var(--num);font-size:15px;font-weight:700;fill:var(--br-ink-active)}
.branch-pct{font-size:10.5px;font-weight:600;fill:var(--br-ink);opacity:.78}
path.branch-stem{stroke:var(--br-line);stroke-width:1;stroke-dasharray:4 4;fill:none}
g.branch.is-hot ~ path.branch-stem{stroke:var(--br-accent)}
path.spine{stroke:#C5D1E3;stroke-width:1.3;fill:none}
.flow-rate{font-size:11.5px;fill:var(--ink-2);font-family:var(--num);font-weight:700}

/* 层分离时才出现的元素：虚线生长 + 数字浮现 */
.gap-reveal{opacity:0;transition:opacity 220ms linear}
#funnelStage.is-split .gap-reveal{opacity:1;transition-delay:calc(240ms + var(--i) * 30ms)}
.stem-clip-rect{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;
  transition:transform 320ms var(--ease-out)}
#funnelStage.is-split .stem-clip-rect{transform:scaleX(1);transition-delay:calc(200ms + var(--i) * 40ms)}
.gap-num{transform:translateY(6px);transition:transform 260ms var(--ease-out)}
#funnelStage.is-split .gap-num{transform:translateY(0)}

/* 合并态：从接缝右端引出的短虚线；分离态淡出，改由更长的中轴虚线接管 */
/* 关闭时整组隐藏 —— 只剩五层严丝合缝的连体漏斗 */
#funnelStage:not(.is-split) g.gap-group{opacity:0;pointer-events:none}

/* 下钻选中：表示「当前下钻范围」。身份已由面板标题与筛选 chip 说明，不需最强标识 */
g.layer.is-active path.layer-shape{stroke:var(--f5-s);stroke-width:2.2}

/* 跨页同步高亮（方案 B｜墨色反相 + 同辈压暗）：
   右侧列表点选某条素材 → 它所在的层直接反相成墨色实底 + 白字，同辈整组压到 34%。
   为什么不用描边或位移：五层是同色相的明度阶梯，任何**固定颜色的描边**必然在一端失效
   （琥珀在 #22458A 上看不见），而 14px 位移在宽层上只占 3% 宽度、感知太弱。
   反相的对比来源是「压暗同辈」而不是「加边框」，因此五层的醒目程度完全一致、与色阶解耦。 */
/* fill 写成 CSS 属性即可压过 SVG 的 presentation attribute，无需改 d 或重设属性 */
#funnelStage.has-peek g.layer:not(.is-peek),
#funnelStage.has-peek .layer-label:not(.is-peek),
#funnelStage.has-peek g.gap-group{opacity:.34}
#funnelStage.has-peek g.branch:not(.is-peek){opacity:.34}
g.layer.is-peek path.layer-shape{fill:var(--ink-invert)}
.layer-label.is-peek{color:#FFFFFF !important}
g.layer.is-peek{filter:drop-shadow(0 6px 18px rgba(15,24,44,.34))}
g.branch.is-peek rect.branch-shape{fill:var(--ink-invert);stroke:none}
g.branch.is-peek text{fill:#FFFFFF}
g.branch.is-peek rect.branch-bar{transform:scaleY(1);opacity:1;fill:#FFFFFF}
#funnelStage.is-mini g.layer:not(.is-active):not(.is-peek) path.layer-shape{filter:saturate(.62)}
#funnelStage.is-mini:not(.is-split) g.gap-group{opacity:0;pointer-events:none}
#funnelStage.is-mini .lbl-big{opacity:0}
#funnelStage.is-mini .lbl-mini{opacity:1}

/* ============ [6] 详情面板 ============ */
.side-panel{overflow:hidden;will-change:transform,opacity}
.rail-label{font-size:9.5px;letter-spacing:1.4px;color:var(--ink-3);margin-bottom:14px}
/* 结论区顶部：维度下拉 + 快速搜索 */
.pick-bar{display:flex;gap:9px;margin-bottom:16px;align-items:stretch}
.pick-bar select{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer}
.pick-bar select:disabled{opacity:.45;cursor:not-allowed}
.pick-bar .search-box{flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);
  transition:border-color 150ms linear}
.pick-bar .search-box:focus-within{border-color:var(--f3)}
.pick-bar .search-box [data-icon]{color:var(--ink-3)}
.pick-bar .search-box [data-icon] svg{width:14px;height:14px}
.pick-bar .search-box input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:12px;padding:8px 0}
.verdict-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#FCFDFF;
  transition:border-color 160ms linear,background 160ms linear}
.verdict-card:hover{border-color:var(--f1-s);background:#F7FAFF}
.verdict-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:7px}
.verdict-tag{font-size:9.5px;padding:2px 7px;border-radius:6px;background:#EAF0FD;color:var(--f4)}
.verdict-tag.warm{background:var(--br-fill);color:var(--br-ink)}
.verdict-card strong{display:block;font-size:13.5px;letter-spacing:-.2px;margin-bottom:5px}
.verdict-card p{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.verdict-card .num{font-family:var(--num);font-weight:600}
.reason-line{margin-bottom:9px}
.reason-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-bottom:4px}
.reason-label b{font-family:var(--num);color:var(--br-ink)}
.reason-track{height:5px;border-radius:3px;background:#F1F3F7;overflow:hidden}
.reason-track i{display:block;height:100%;border-radius:3px;background:var(--br-accent);opacity:.75}
.reason-row{width:100%;text-align:left;border-radius:8px;padding:4px 6px;margin:0 -6px;transition:background 150ms linear}
.reason-row:hover{background:#FAF7F1}
.gap-note{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--br-stroke);background:#FDFBF7;
  border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--br-ink);line-height:1.6}
.section-gap{height:20px}

.list-controls{display:flex;gap:10px;padding:0 24px 14px;flex-wrap:wrap}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;padding:0 12px;color:var(--ink-3)}
.search-box input{border:0;outline:0;background:transparent;padding:9px 0;width:100%;font-size:12.5px;color:var(--ink)}
.search-box>svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.list-controls select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);cursor:pointer}
.scope-strip{display:flex;align-items:center;gap:10px;margin:0 24px 12px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.scope-pill{display:inline-flex;align-items:center;gap:7px;background:#EAF0FD;color:var(--f4);font-size:11px;
  padding:4px 6px 4px 10px;border-radius:8px;font-weight:600}
.scope-pill.warm{background:var(--br-fill);color:var(--br-ink)}
.scope-pill button{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;opacity:.6}
.scope-pill button:hover{opacity:1;background:rgba(0,0,0,.06)}

.table-wrap{overflow-x:auto;padding:0 24px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;padding:0 10px 9px 0;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line-2);font-size:12px;vertical-align:middle}
tr.row-click{cursor:pointer;transition:background 140ms linear}
tr.row-click:hover td{background:#F3F7FD}
tr.row-flash td{animation:rowFlash 1.4s ease-out}
@keyframes rowFlash{0%,40%{background:#EAF0FD}100%{background:transparent}}
/* 行选中：比 hover 更深的蓝色，深蓝竖线移到缩略图之外作为跨区关联锚点 */
tr.row-sel td{background:#E5EEFC}
tr.row-sel td:first-child{position:relative}
tr.row-sel td:first-child::before{content:'';position:absolute;left:-11px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--f5);
  box-shadow:0 0 0 1px rgba(255,255,255,.78),0 2px 7px rgba(34,69,138,.28)}
tr.row-sel:hover td{background:#DCE8FA}
/* 详情按钮：hover 时出现 4px 实心偏移阴影 */
.detail-arrow{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--ink);background:var(--surface);
  color:var(--ink);display:flex;align-items:center;justify-content:center;
  transition:box-shadow 200ms ease,transform 200ms ease,background 200ms ease}
.detail-arrow [data-icon] svg{width:19px;height:19px;stroke-width:1.9}
.detail-arrow:hover{box-shadow:4px 4px 0 0 var(--ink);transform:translate(-1px,-1px);background:#fff}
.detail-arrow:active{box-shadow:1px 1px 0 0 var(--ink);transform:translate(1px,1px)}
.asset{display:flex;align-items:center;gap:10px}
.thumb{width:34px;height:44px;border-radius:7px;overflow:hidden;flex-shrink:0;background:#F1F3F7}
.thumb svg{width:100%;height:100%}
.asset-name{font-weight:600;font-size:12.5px;letter-spacing:-.1px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-id{font-family:var(--num);font-size:11.5px;color:var(--ink-3);margin-top:3px;font-weight:500}
.cell-2{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.cell-game{font-size:12.5px;font-weight:700;letter-spacing:-.1px;white-space:nowrap}
.cell-date{font-family:var(--num);font-size:12px;color:var(--ink-2);white-space:nowrap}
.cell-owner{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.status-chip{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:#F1F3F7;color:var(--ink-2);white-space:nowrap}
.status-chip.warm{background:var(--br-fill);color:var(--br-ink)}
.status-chip.cool{background:#EAF0FD;color:var(--f4)}
.status-chip.win{background:#E6F4EC;color:#1D6B44}
.status-chip.lose{background:#FBEDEC;color:#A2423C}
.reason-cell{max-width:300px}
.reason-cell strong{font-size:11.5px;display:block;margin-bottom:3px}
/* 业务反馈加粗、用正文墨色（不是灰）—— 它是这张表里信息价值最高的一列 */
.reason-cell p{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.55}
.ver-badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--num);font-size:10px;font-weight:600;
  background:#EFEAFB;color:#5A4BA8;padding:2px 6px;border-radius:6px;margin-left:6px}
.empty-row{padding:40px 0;text-align:center;color:var(--ink-3)}
.empty-row strong{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
.empty-row span{font-size:11.5px}
.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 18px;font-size:10.5px;color:var(--ink-3)}
.pagination{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:11.5px;color:var(--ink-2)}

/* 卡内 stagger */
.stagger-in{opacity:0;transform:translateY(8px)}
.stagger-in.on{opacity:1;transform:none;transition:opacity 260ms linear,transform 300ms var(--ease-out)}

/* ============ [8] 生命周期进度条 + 素材弹窗 ============ */
.lifebar{display:flex;align-items:center;gap:0;min-width:210px}
.lifebar .node{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.6px solid var(--line);background:#fff;position:relative}
.lifebar .node.done{border-color:transparent}
.lifebar .node.stay{box-shadow:0 0 0 3px rgba(185,138,62,.30)}
.lifebar .seg{flex:1;height:2px;background:var(--line);min-width:16px}
.lifebar .seg.done{background:var(--f3)}
.lifebar .seg.todo{background:transparent;border-top:2px dashed var(--line)}
.life-legend{display:flex;gap:0;margin-top:5px;font-size:9px;color:var(--ink-3);min-width:210px}
.life-legend span{flex:1;text-align:center}
.life-legend span:first-child{text-align:left}
.life-legend span:last-child{text-align:right}

dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(35,50,78,.42);backdrop-filter:blur(3px)}
.sheet{width:min(720px,calc(100vw - 32px));max-height:min(86vh,900px);background:var(--surface);
  border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(20,36,68,.4)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);flex-shrink:0}
.sheet-head .eyebrow{font-size:9.5px;letter-spacing:1.3px;color:var(--ink-3)}
.sheet-body{overflow-y:auto;padding-bottom:10px}
.detail-hero{display:flex;gap:18px;padding:22px}
.hero-art{width:92px;height:118px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#F1F3F7}
.hero-art svg{width:100%;height:100%}
.hero-meta{min-width:0}
.hero-meta .eyebrow{font-family:var(--num);font-size:10.5px;color:var(--ink-3);letter-spacing:.4px}
.hero-meta h2{font-size:20px;letter-spacing:-.5px;margin:5px 0 8px}
.hero-line{font-size:11.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.6}
.detail-section{padding:18px 22px;border-top:1px solid var(--line-2)}
.detail-section h3{font-size:12px;color:var(--ink-3);letter-spacing:.4px;margin-bottom:12px;font-weight:600}
.record-box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#FCFDFF}
.record-box .when{font-size:10.5px;color:var(--ink-3);margin-bottom:7px}
.record-box strong{font-size:13px;display:block;margin-bottom:5px}
.record-box p{font-size:12px;color:var(--ink-2);line-height:1.65}
.next-action{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--br-ink)}
.channel-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
.channel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.channel-top strong{font-size:12.5px}
.channel-id{font-family:var(--num);font-size:10px;color:var(--ink-3)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px;margin-top:11px}
.metric-grid small{display:block;font-size:9.5px;color:var(--ink-3);margin-bottom:3px}
.metric-grid strong{font-family:var(--num);font-size:14px;font-weight:600}
.muted-note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.version-link{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:8px;font-size:12px;text-align:left;transition:border-color 150ms linear,background 150ms linear}
.version-link:hover{border-color:var(--f1-s);background:#F7FAFF}
.version-link .grow{flex:1;min-width:0}
.version-link .role{font-size:10px;color:var(--ink-3)}
.check-strip{display:flex;align-items:center;gap:9px;background:#E9F5EE;border:1px solid #BFE0CC;color:#1D6B44;
  border-radius:11px;padding:11px 14px;font-size:12px;margin:16px 0 4px}
.check-strip.bad{background:#FBEDEC;border-color:#EFC9C5;color:#A2423C}
.caliber-table{width:100%;margin-top:6px}
.caliber-table td{font-size:11.5px;padding:8px 10px 8px 0;vertical-align:top}
.caliber-table td:first-child{width:118px;color:var(--ink-3);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#252B36;color:#fff;
  font-size:12.5px;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;z-index:60;
  transition:opacity 200ms linear,transform 240ms var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ [9] 素材跟踪页 ============ */
.track-filters{display:flex;gap:10px;padding:0 24px 14px;flex-wrap:wrap;align-items:center}
.track-filters select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);cursor:pointer}
.track-filters .search-box,.track-filters select,.queue-controls .search-box,.queue-controls select{
  border-color:#9AB9E6;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(239,246,255,.78));
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 7px 18px -16px rgba(34,69,138,.54);
  transition:border-color 150ms linear,box-shadow 150ms linear,background 150ms linear}
.track-filters .search-box:hover,.track-filters select:hover,.queue-controls .search-box:hover,.queue-controls select:hover{border-color:#6F9BD8;background:rgba(247,251,255,.96)}
.track-filters .search-box:focus-within,.queue-controls .search-box:focus-within,.track-filters select:focus,.queue-controls select:focus{
  outline:0;border-color:#2F6FEB;box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(47,111,235,.14),0 9px 20px -16px rgba(34,69,138,.55)}

/* ============ [9.5] 反馈迭代 ============ */
.feedback-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;min-height:44px}
.role-switch{width:248px;height:44px;padding:4px;display:grid;grid-template-columns:1fr 1fr;flex-shrink:0;
  border:1px solid rgba(61,108,191,.34);background:linear-gradient(145deg,rgba(238,245,255,.94),rgba(249,252,255,.84));
  box-shadow:inset 0 1px 0 #fff,0 10px 24px -19px rgba(34,69,138,.55)}
.role-tab{height:36px;border-radius:999px;font-size:12.5px;color:var(--ink-2);font-weight:600;
  transition:background 180ms linear,color 180ms linear,box-shadow 180ms linear,transform 120ms var(--ease-out)}
.role-tab:not(.active):hover{color:var(--f5);background:rgba(255,255,255,.72)}
.role-tab:active{transform:scale(.97)}
.role-tab.active{color:#fff;background:linear-gradient(135deg,#4A79C9,#22458A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 7px 15px -8px rgba(34,69,138,.72)}
.feedback-summary{display:flex;align-items:center;gap:20px;min-width:0;flex:1;color:var(--ink-2);font-size:11.5px}
.feedback-summary b{font-family:var(--num);font-size:17px;color:var(--ink);margin-right:4px}
.danger-outline{color:#9A4D47;border-color:#E8CBC8;white-space:nowrap}
.danger-outline:hover{color:#823C37;border-color:#D9AAA6;background:#FFF8F7}
.workbench{display:grid;grid-template-columns:minmax(330px,38%) minmax(0,1fr);min-height:660px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 18px 48px -36px rgba(28,52,96,.32)}
.queue-pane{border-right:1px solid var(--line);min-width:0;background:#FBFCFE;display:flex;flex-direction:column}
.queue-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88)}
.queue-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.queue-title h2{font-size:15px;letter-spacing:0}
.queue-title span{font-family:var(--num);font-size:11px;color:var(--ink-3)}
.queue-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.queue-tabs::-webkit-scrollbar{display:none}
.queue-tabs button{padding:6px 9px;border-radius:8px;white-space:nowrap;font-size:11px;color:var(--ink-2)}
.queue-tabs button.active{background:#EAF0FD;color:var(--f5);font-weight:700}
.queue-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.queue-controls .search-box{min-width:0;background:#fff}
.queue-controls select,.field-select{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 28px 0 10px;
  background:#fff;color:var(--ink-2);font-size:11.5px;cursor:pointer}
.queue-controls .search-box,.queue-controls select{
  border-color:#9AB9E6;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(239,246,255,.78));
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 7px 18px -16px rgba(34,69,138,.54)}
.queue-list{overflow:auto;flex:1;min-height:0}
.queue-empty{padding:54px 24px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.7}
.queue-empty strong{display:block;color:var(--ink-2);font-size:13px;margin-bottom:5px}
.queue-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;text-align:left;
  padding:13px 16px;border-bottom:1px solid var(--line-2);background:transparent;transition:background 150ms linear}
.queue-row:hover{background:#F3F7FD}
.queue-row.active{background:#E7EFFB;box-shadow:inset 3px 0 0 var(--f5)}
.queue-thumb{width:42px;height:54px;border-radius:8px;overflow:hidden;background:#EDF1F7}
.queue-thumb svg{width:100%;height:100%}
.queue-main{min-width:0}
.queue-main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;margin-bottom:4px}
.queue-meta{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-tail{text-align:right;align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px}
.queue-due{font-family:var(--num);font-size:10px;color:var(--ink-3);white-space:nowrap}
.queue-due.overdue{color:#A2423C;font-weight:700}
.feedback-detail{min-width:0;overflow:auto;background:#fff}
.detail-empty{min-height:640px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink-3);gap:8px}
.detail-empty strong{font-size:14px;color:var(--ink-2)}
.work-detail-head{display:flex;align-items:flex-start;gap:16px;padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.work-detail-art{width:64px;height:82px;border-radius:11px;overflow:hidden;background:#F1F3F7;flex-shrink:0}
.work-detail-art svg{width:100%;height:100%}
.work-detail-title{min-width:0;flex:1}
.work-detail-title .eyebrow{font-family:var(--num);font-size:10px;color:var(--ink-3);margin-bottom:5px}
.work-detail-title h2{font-size:18px;letter-spacing:0;overflow-wrap:anywhere}
.work-detail-title p{font-size:11.5px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.work-detail-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);min-height:550px}
.work-form,.work-history{padding:20px 24px}
.work-history{border-left:1px solid var(--line);background:#FBFCFE}
.subhead{font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:12px}
.fact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:18px}
.fact{padding:10px 11px;background:#F7F9FC;border-radius:9px;min-width:0}
.fact small{display:block;font-size:9.5px;color:var(--ink-3);margin-bottom:4px}
.fact strong{display:block;font-family:var(--num);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  padding:10px 11px;font-size:12px;outline:none;transition:border-color 150ms linear,box-shadow 150ms linear}
.field textarea{min-height:92px;resize:vertical;line-height:1.6}
.field input,.field select{height:38px}
.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--f3);box-shadow:0 0 0 3px rgba(110,155,221,.13)}
.decision-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.decision-toggle button{height:38px;border:1px solid var(--line);border-radius:10px;color:var(--ink-2);font-size:12px;font-weight:700}
.decision-toggle button[data-v=adopted].active{background:#E9F5EE;border-color:#BFE0CC;color:#1D6B44}
.decision-toggle button[data-v=rejected].active{background:#FBEDEC;border-color:#EFC9C5;color:#A2423C}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;align-items:center;gap:9px;margin-top:16px;flex-wrap:wrap}
.form-help{font-size:10.5px;color:var(--ink-3);line-height:1.55;margin-top:8px}
.inline-error{font-size:10.5px;color:#A2423C;margin-top:7px;min-height:16px}
.timeline{position:relative;margin-top:4px}
.timeline::before{content:'';position:absolute;left:5px;top:7px;bottom:8px;width:1px;background:#DDE3EC}
.timeline-item{position:relative;padding-left:22px;margin-bottom:17px}
.timeline-item::before{content:'';position:absolute;left:1px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--f3);box-shadow:0 0 0 3px #EEF3FB}
.timeline-item.warm::before{background:var(--br-accent);box-shadow:0 0 0 3px var(--br-fill)}
.timeline-item time{display:block;font-family:var(--num);font-size:9.5px;color:var(--ink-3);margin-bottom:4px}
.timeline-item strong{display:block;font-size:11.5px;margin-bottom:3px}
.timeline-item p{font-size:11px;line-height:1.55;color:var(--ink-2);overflow-wrap:anywhere}
.chain-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:17px}
.chain-node{font-family:var(--num);font-size:10.5px;padding:5px 8px;border-radius:7px;background:#EAF0FD;color:var(--f4);font-weight:700}
.chain-arrow{color:var(--ink-3);font-size:10px}
.task-status{display:flex;align-items:center;gap:6px;margin-bottom:15px}
.task-step{flex:1;height:5px;border-radius:4px;background:#E9ECF1}
.task-step.done{background:var(--f3)}
.task-state-label{font-size:10px;color:var(--ink-3);margin-left:5px;white-space:nowrap}

/* ============ [9.6] 数据看板 ============ */
.dash-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px;perspective:800px}
.dash-kpi{position:relative;padding:17px 15px;min-width:0;text-align:left;color:var(--ink);background:rgba(255,255,255,.88);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -30px rgba(28,52,96,.34);
  transform-origin:center;transform-style:preserve-3d;will-change:transform;z-index:0}
.dash-kpi.is-tilting{z-index:3}
.dash-kpi[aria-pressed=true]{border-color:#2F6FEB;box-shadow:inset 0 0 0 1px rgba(47,111,235,.22),0 14px 34px -30px rgba(28,52,96,.34)}
.dash-kpi small{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:8px}
.dash-kpi strong{display:block;font-family:var(--num);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-delta{font-family:var(--num);font-size:10px;color:var(--ink-3);margin-top:7px;min-height:14px}
.dash-delta.up{color:#1D6B44}.dash-delta.down{color:#A2423C}
.dash-context{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--ink-3);font-size:11px;margin:0 2px 12px}
.dash-context strong{color:var(--ink-2)}
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:36px;gap:14px}
.metric-card{grid-column:span 6;grid-row:span 10;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;
  display:flex;flex-direction:column;box-shadow:0 18px 42px -36px rgba(28,52,96,.34);transition:box-shadow 180ms linear,border-color 180ms linear}
.metric-card:hover{border-color:#D8E2F2;box-shadow:0 20px 44px -32px rgba(28,52,96,.30)}
.metric-card.is-selected{border-color:#2F6FEB;box-shadow:inset 0 0 0 1px rgba(47,111,235,.34),0 20px 44px -32px rgba(28,52,96,.30)}
.metric-card:last-child:nth-child(odd){grid-column:span 12}
.metric-card.wide{grid-column:span 8;grid-row:span 11}
.metric-card.square{grid-column:span 4;grid-row:span 11}
.metric-card.half{grid-column:span 6;grid-row:span 10}
.metric-head{display:flex;align-items:flex-start;gap:12px;padding:17px 18px 6px;min-height:68px}
.metric-title{min-width:0;flex:1}
.metric-title small{display:block;color:var(--ink-3);font-size:10px;margin-bottom:5px}
.metric-value{display:flex;align-items:baseline;gap:5px;min-width:0}
.metric-value strong{font-family:var(--num);font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value span{font-size:10.5px;color:var(--ink-3)}
.chart-select{height:34px;max-width:142px;border:1px solid var(--line);border-radius:9px;background:#F9FAFC;color:var(--ink-2);
  padding:0 26px 0 9px;font-size:10.5px;cursor:pointer}
.chart-wrap{position:relative;flex:1;min-height:0;padding:4px 14px 14px;display:flex;align-items:stretch;justify-content:stretch}
.chart-wrap svg{width:100%;height:100%;min-height:230px;overflow:visible}
.chart-grid-line{stroke:#E9EDF3;stroke-width:1}
.chart-axis-text{fill:#929CAA;font-family:var(--sans);font-size:10px}
.chart-value-label{fill:#30343A;font-family:var(--num);font-size:10px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.chart-center-label{fill:var(--ink-3);font-family:var(--sans);font-size:10px}
.chart-center-value{fill:var(--ink);font-family:var(--num);font-size:18px;font-weight:700}
.chart-line{fill:none;stroke:var(--series-color,#2F6FEB);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#chartAreaFill);opacity:.65}
.chart-point{fill:#fff;stroke:var(--series-color,#2F6FEB);stroke-width:2.5;cursor:pointer;outline:none}
.chart-point:focus,.chart-point:hover{fill:var(--series-color,#2F6FEB);stroke-width:4}
.chart-bar{fill:var(--bar-color,#1697B5);rx:6;cursor:pointer;outline:none;transition:opacity 120ms linear}
.chart-bar:focus,.chart-bar:hover{opacity:.72}
.chart-dot{fill:var(--series-color,#2F6FEB);stroke:#fff;stroke-width:2;cursor:pointer;outline:none}
.chart-dot:focus,.chart-dot:hover{fill:#F05A0A;stroke-width:4}
.donut-ring{fill:none;stroke-width:26;cursor:pointer;outline:none;transition:opacity 120ms linear}
.donut-ring:focus,.donut-ring:hover{opacity:.72}
.chart-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 11px;align-content:center;padding:4px 4px 4px 12px;min-width:42%}
.legend-row{display:flex;align-items:center;gap:7px;min-width:0;font-size:10px;color:var(--ink-2)}
.legend-row i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.legend-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-row b{margin-left:auto;font-family:var(--num);font-size:9.5px;color:var(--ink)}
.donut-layout{display:flex;align-items:center;width:100%;min-height:230px}
.donut-layout svg{width:52%;min-width:0}
.chart-tooltip{position:absolute;z-index:4;pointer-events:none;opacity:0;transform:translate(-50%,-100%) translateY(-9px);
  background:#1F2734;color:#fff;border-radius:8px;padding:7px 9px;font-size:10px;line-height:1.45;white-space:nowrap;
  box-shadow:0 9px 24px -10px rgba(18,28,44,.55);transition:opacity 100ms linear}
.chart-tooltip.show{opacity:1}
.dash-empty{width:100%;min-height:230px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink-3);font-size:11px;gap:5px;text-align:center}
.dash-empty strong{color:var(--ink-2);font-size:13px}

/* ============ [9.8] 明暗主题 ============ */

/* ============ [10] 响应式（无侧栏后，断点整体下移 208px） ============ */
@media(max-width:1300px){
  :root{--col-funnel:748px;--col-side:minmax(300px,1fr)}
}
@media(max-width:1220px){
  #workspace{grid-template-columns:1fr}
  #workspace.mini-on{grid-template-columns:var(--col-funnel) var(--col-side)}
  .side-panel{margin-top:4px}
  .work-detail-body{grid-template-columns:1fr}
  .work-history{border-left:0;border-top:1px solid var(--line)}
  .metric-card.wide{grid-column:span 12}
  .metric-card.square{grid-column:span 6}
}
@media(max-width:1050px){.dash-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:920px){
  main{padding:22px 18px 36px}
  #funnelSlot{margin:0 14px}
  .workbench{grid-template-columns:1fr;min-height:0}
  .queue-pane{border-right:0;border-bottom:1px solid var(--line);max-height:520px}
  .feedback-detail{min-height:560px}
  .dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-card,.metric-card.square,.metric-card.half{grid-column:span 6}
}
@media(max-width:700px){
  #workspace,#workspace.mini-on{grid-template-columns:1fr}
  #funnelSlot{overflow-x:auto}
  .topbar{height:auto;min-height:68px;padding:10px 14px;flex-wrap:wrap;gap:8px}
  .topbar-actions{order:2;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
  .top-nav{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;overflow:hidden}
  .nav-item{justify-content:center;padding:8px 5px;font-size:11.5px}
  .lang-toggle{min-width:66px;padding:0 10px}
  .theme-toggle{width:50px}
  .feedback-toolbar{align-items:stretch;flex-wrap:wrap}
  .role-switch{width:100%}
  .feedback-summary{order:3;width:100%;gap:12px;display:grid;grid-template-columns:repeat(3,1fr)}
  .feedback-summary b{display:block}
  .work-detail-head{padding:18px}
  .work-form,.work-history{padding:18px}
  .dash-grid{display:block}
  .metric-card,.metric-card.wide,.metric-card.square,.metric-card.half{min-height:360px;margin-bottom:14px}
  .dash-context{align-items:flex-start;flex-direction:column;gap:4px}
}
@media(max-width:560px){
  .topbar{gap:8px}
  .brand{font-size:15px;gap:9px}
  .brand-mark{width:32px;height:32px;font-size:12.5px}
  .brand small{display:none}
  .top-nav.is-en .nav-item{white-space:normal;line-height:1.12;text-align:center;font-size:9.5px;min-height:48px;padding:6px 2px}
  main{padding:18px 12px 30px}
  .page-heading h1{font-size:22px}
  .filters{gap:9px;padding:11px 12px}
  .filter-divider{display:none}
  .filter-field:has(.date-range){width:100%;display:grid;grid-template-columns:16px minmax(0,1fr);gap:5px 7px}
  .filter-field:has(.date-range) .date-range{grid-column:1/-1;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .date-trigger{min-width:0;width:100%;padding:0 8px}
  .date-trigger .date-value{font-size:11px}
  .filter-reset{margin-left:auto}
  .dash-kpi{padding:15px 14px}.dash-kpi strong{font-size:20px}
  .feedback-summary{font-size:10px}.feedback-summary b{font-size:15px}
  .danger-outline{width:100%;justify-content:center}
  .queue-controls{grid-template-columns:1fr}
  .work-detail-art{width:54px;height:70px}
  .fact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-row{grid-template-columns:1fr}
  .metric-head{flex-wrap:wrap}.chart-select{max-width:none;width:100%}
}

/* ============ [11] reduced-motion（JS 加类，因为 CSS 管不到 WAAPI） ============ */
.reduced-motion *{transition-duration:0s!important;animation:none!important}
.reduced-motion .download-button:hover .download,.reduced-motion .download-button:focus-visible .download{transform:translateY(0)!important}
@media (hover:hover) and (pointer:fine){
  .calendar-nav button:hover:not(:disabled),.calendar-actions button:hover{background:rgba(255,255,255,.76);color:var(--ink)}
  .calendar-day:hover:not(:disabled):not([aria-selected=true]){background:#EAF0FD;color:var(--f5)}
}
@media (prefers-reduced-motion:reduce){.selection-link-flow{animation:none}}
@media (prefers-reduced-transparency:reduce){
  .filters,.game-menu,.date-popover,.role-switch{background:#F8FAFD;-webkit-backdrop-filter:none;backdrop-filter:none}
  html[data-theme=dark] .filters,html[data-theme=dark] .game-menu,html[data-theme=dark] .date-popover,html[data-theme=dark] .role-switch{background:#171E28}
}
@media (prefers-contrast:more){
  .workbench,.metric-card,.dash-kpis{border-color:#7A8494}
  .role-switch,.filters{background:#fff}
  html[data-theme=dark] .role-switch,html[data-theme=dark] .filters{background:#121821}
}

/* ============ [12] V2.0 白色主题 ============
   浅色模式改为纯白工作区；蓝色只保留为数据层级与交互状态色。 */
html:not([data-theme=dark]){
  color-scheme:light;
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#171A20;--ink-2:#5B6472;--ink-3:#89919E;
  --line:#DDE2E8;--line-2:#EDF0F3;--ink-light:#171A20
}
html:not([data-theme=dark]) body,
html:not([data-theme=dark]) main{background:#FFFFFF}
html:not([data-theme=dark]) .ambient{display:none}
html:not([data-theme=dark]) .topbar{
  background:#FFFFFF;border-bottom-color:#E2E6EB;box-shadow:0 1px 0 rgba(17,24,39,.02)
}
html:not([data-theme=dark]) .lg,
html:not([data-theme=dark]) .lg-flat{
  background:#FFFFFF;border:1px solid #DDE2E8;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 8px 24px -20px rgba(17,24,39,.34)
}
html:not([data-theme=dark]) .top-nav.lg{border:0}
html:not([data-theme=dark]) .lg::before,
html:not([data-theme=dark]) .lg-flat::before,
html:not([data-theme=dark]) .lg::after,
html:not([data-theme=dark]) .lg-flat::after{display:none}
html:not([data-theme=dark]) .filters,
html:not([data-theme=dark]) .date-popover,
html:not([data-theme=dark]) .game-menu,

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* 最大余额法：把 total 按 ratios 拆成整数，和精确等于 total */
function largestRemainder(total,ratios){
  const raw=ratios.map(r=>total*r), base=raw.map(Math.floor);
  const order=raw.map((v,i)=>[v-base[i],i]).sort((a,b)=>b[0]-a[0]);
  const gap=total-base.reduce((a,b)=>a+b,0);
  for(let i=0;i<gap;i++)base[order[i%order.length][1]]++;
  return base;
}

/* ==================================================================
   §2  generate() —— 从漏斗目标数字反推生成，而不是随机后统计
   铁律：先定层数字 → 再算漏出 → 再拆分支 → 最后逐条发牌附属性。
   属性是 stage/branch 已定之后填的装饰，永远不可能反过来影响层计数。
   ================================================================== */
function generate(){
  const rnd=mulberry32(20260927);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const ri=(lo,hi)=>lo+Math.floor(rnd()*(hi-lo+1));
  const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
  const wpick=es=>{const t=es.reduce((a,e)=>a+e[1],0);let x=rnd()*t;for(const[k,w]of es){if((x-=w)<=0)return k;}return es[0][0];};
  const dealer=pool=>{let bag=[];return()=>{if(!bag.length)bag=shuffle(pool);return bag.pop();};};
  const hookDeal={}; Object.keys(HOOKS).forEach(g=>hookDeal[g]=dealer(HOOKS[g]));
  const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
  const seq={}, rows=[];

  function mkRow(game,prefix,month,stage,branch){
    const key=prefix+month; seq[key]=(seq[key]||0)+1;
    const id=prefix+'-'+month.slice(2,4)+month.slice(5,7)+'-'+String(seq[key]).padStart(3,'0');
    const mk=pick(MARKETS), market=mk[0], language=mk[1];
    const kind=rnd()<0.85?'paid':'organic';
    const deliveryDate=month+'-'+String(ri(1,28)).padStart(2,'0');
    const q=Number(month.slice(5,7))<=6?0:2;
    const bf=BRIEF_POOL[game][q+(rnd()<0.5?0:1)];

    const r={
      id, briefId:bf[0], briefTitle:bf[1], game, title:hookDeal[game](),
      version:'v1', generation:1, rootId:id, parentId:null, childIds:[],
      reviseMotive:null, reviseAction:null,
      ai:{model:'Muse-V3',pipeline:pick(['t2v+i2v','i2v+ctrl','t2v']),genSeconds:ri(95,320),humanEditLevel:pick(['none','light','medium'])},
      creativeType:pick(CREATIVE_TYPES), aspect:pick(ASPECTS), durationSec:ri(12,30),
      market, language, kind, stage, branch,
      deliveryDate, decision:'pending', decisionDate:null, decisionOwner:pick(OWNERS),
      rejectReasonCode:null, rejectReasonText:null, holdNote:null,
      channels:[], recovered:false, recoverDate:null, dataGapReason:null,
      metrics:null, sampleSufficient:false,
      reviewed:false, reviewDate:null, verdict:null, reviewScore:null, reviewInsight:null
    };

    /* 层1→2 业务决策 */
    if(branch==='adopt_pending'){ r.holdNote=pick(PENDING_REASONS); }
    else if(branch==='adopt_rejected'){
      r.decision='rejected'; r.decisionDate=addDays(deliveryDate,ri(1,6));
      r.rejectReasonCode=wpick(REJECT_W);
      r.rejectReasonText=pick(REJECT_TEXT[r.rejectReasonCode]);
    } else { r.decision='adopted'; r.decisionDate=addDays(deliveryDate,ri(1,6)); }

    /* 层2→3 渠道去向 */
    const mkCh=(p,k,state,launchDate,matched)=>({
      platform:p, account:'SIM-'+prefix+'-'+p.split(' ')[0].toUpperCase(),
      externalId:'SIM-'+id+'-'+String(k+1).padStart(2,'0'),
      market, state, launchDate, idMatched:matched
    });
    if(stage>=3){
      const plats=shuffle(kind==='paid'?PAID_CH:ORG_CH).slice(0,ri(1,kind==='paid'?3:2));
      const launchDate=addDays(r.decisionDate,ri(2,10));
      r.channels=plats.map((p,k)=>mkCh(p,k,'live',launchDate,true));
    } else if(stage===2){
      const plats=shuffle(kind==='paid'?PAID_CH:ORG_CH).slice(0,ri(1,2));
      r.channels=plats.map((p,k)=>mkCh(p,k,branch==='launch_blocked'?'blocked':'scheduled',null,false));
      r.holdNote=branch==='launch_blocked'?pick(BLOCK_REASONS):pick(SCHED_REASONS);
    }

    /* 层3→4 数据回收 */
    if(stage===3){
      r.dataGapReason=pick(GAP_REASONS[branch]);
      if(branch==='recover_unmatched')r.channels.forEach(c=>c.idMatched=false);
    }
    if(stage>=4){
      r.recovered=true;
      r.recoverDate=addDays(r.channels[0].launchDate,ri(5,14));
      const short=(stage===4&&branch==='sample_short');
      r.sampleSufficient=!short;
      if(kind==='paid'){
        const impressions=short?ri(1200,9600):ri(11000,860000);
        const clicks=Math.round(impressions*(short?ri(70,240):ri(80,420))/10000);
        const installs=Math.max(1,Math.round(clicks*ri(900,2600)/10000));
        const cpi=ri(800,4200)/100;
        r.metrics={impressions,clicks,installs,spend:Math.round(installs*cpi*100)/100,views:null,completion:null};
      }else{
        const views=short?ri(900,8800):ri(12000,520000);
        r.metrics={impressions:views,clicks:null,installs:null,spend:null,views,completion:ri(18,62)};
      }
    }

    /* 层4→5 评测结论 */
    if(stage===5){
      r.reviewed=true; r.reviewDate=addDays(r.recoverDate,ri(2,8));
      const t=rnd();
      r.verdict=t<0.30?'win':t<0.75?'neutral':'lose';
      r.reviewScore=r.verdict==='win'?ri(78,96):r.verdict==='neutral'?ri(55,77):ri(28,54);
      r.reviewInsight=r.verdict==='win'
        ?pick(['前3秒的失败瞬间是主要驱动，CTR 显著高于同批次。','本地化配音带来的完播提升明显，建议复用该模板。','数值对比结构在该市场表现稳定，可以扩量。'])
        :r.verdict==='neutral'
        ?pick(['指标落在同批次中位，未看出明确优劣，建议扩样本。','CTR 尚可但转化偏弱，落地页可能是瓶颈，非素材问题。','表现平稳，可作为基线版本保留对照。'])
        :pick(['中段节奏拖沓，完播在第 9 秒断崖下跌。','钩子与实际玩法预期不一致，安装后留存明显偏低。','该市场用户对纯 CG 表达接受度低，CTR 垫底。']);
    }
    return r;
  }

  /* 配额分配主循环 */
  MONTHS.forEach((month,mi)=>{
    const per=largestRemainder(50,GAMES.map(g=>g[1]));
    GAMES.forEach((g,gi)=>{
      const game=g[0], prefix=g[2], n1=per[gi];
      const n2=Math.round(n1*RET.adopt[mi]);
      const n3=Math.round(n2*RET.launch[mi]);
      const n4=Math.round(n3*RET.recover[mi]);
      const n5=Math.round(n4*RET.review[mi]);
      const n=[n1,n2,n3,n4,n5];
      for(let L=1;L<=4;L++){
        const parts=largestRemainder(n[L-1]-n[L],BRANCH_SPLIT[L-1]);
        BRANCHES[L].forEach((b,j)=>{ for(let k=0;k<parts[j];k++)rows.push(mkRow(game,prefix,month,L,b[0])); });
      }
      for(let k=0;k<n[4];k++)rows.push(mkRow(game,prefix,month,5,null));
    });
  });

  /* 改版链：只改 parentId/version/generation/动因，绝不动 stage，也不改写任何日期 */
  const canRevise=r=>(r.branch==='adopt_rejected'&&REVISABLE.has(r.rejectReasonCode))||r.verdict==='lose'||r.branch==='sample_short';
  const fbDay=r=>r.decisionDate||r.reviewDate||r.deliveryDate;
  const pool=shuffle(rows.filter(canRevise));
  const cand=shuffle(rows.filter(r=>r.generation===1));
  const avail=new Set(cand.map(r=>r.id));

  /* dir: 1 改版后推进更深（优化有效）/ 0 持平 / -1 反而更浅（优化失败）
     不改 stage，而是按目标方向去"挑"候选，从而得到想要的收敛率分布 */
  function attach(parent,dir){
    const base=fbDay(parent);
    for(const c of cand){
      if(!avail.has(c.id)||c.id===parent.id)continue;
      if(c.game!==parent.game||c.rootId!==c.id||c.childIds.length)continue;
      if(Math.sign(c.stage-parent.stage)!==dir)continue;
      if(c.deliveryDate<=base)continue;
      if((new Date(c.deliveryDate)-new Date(base))/864e5>60)continue;
      /* 父版本一旦成链就退出候选池，否则它日后可能被当成别人的子版本，
         rootId 被改写，导致它已有的子版本指向一个失效的链根 */
      avail.delete(c.id); avail.delete(parent.id);
      c.parentId=parent.id; c.rootId=parent.rootId;
      c.generation=parent.generation+1; c.version='v'+c.generation;
      c.reviseMotive=parent.rejectReasonCode||parent.verdict||parent.branch;
      c.reviseAction=ACTION_BY_MOTIVE[c.reviseMotive]||'针对上一版反馈重做中段演示';
      c.briefId=parent.briefId; c.briefTitle=parent.briefTitle;
      if(c.creativeType===parent.creativeType&&c.durationSec===parent.durationSec)
        c.creativeType=CREATIVE_TYPES[(CREATIVE_TYPES.indexOf(parent.creativeType)+1)%5];
      parent.childIds.push(c.id);
      return c;
    }
    return null;
  }
  const tryAttach=(p,dirs)=>{for(const d of dirs){const c=attach(p,d);if(c)return c;}return null;};

  /* v1→v2 目标 62% 提升 / 23% 持平 / 15% 下降；v2→v3 降到 48/30/22 体现边际收益递减 */
  const q2=largestRemainder(56,[0.62,0.23,0.15]);
  const plan2=shuffle([].concat(Array(q2[0]).fill(1),Array(q2[1]).fill(0),Array(q2[2]).fill(-1)));
  const gen2=[]; let pi=0;
  for(const dir of plan2){
    while(pi<pool.length){
      const p=pool[pi++]; if(p.rootId!==p.id)continue;
      const c=tryAttach(p,[dir,0,1,-1]); if(c){gen2.push(c);break;}
    }
  }
  const rev2=shuffle(gen2.filter(canRevise));
  const q3=largestRemainder(Math.min(16,rev2.length),[0.48,0.30,0.22]);
  const plan3=shuffle([].concat(Array(q3[0]).fill(1),Array(q3[1]).fill(0),Array(q3[2]).fill(-1)));
  let ci=0;
  for(const dir of plan3){
    while(ci<rev2.length){ if(tryAttach(rev2[ci++],[dir,0,1,-1]))break; }
  }
  return rows;
}

/* ==================================================================
   §2.5  投放明细 + 可重放操作日志
   基线仍由固定种子生成；localStorage 只保存用户动作，不复制整份模拟数据。
   ================================================================== */
const STORE_KEY='ai-muse-lab-actions-v1';
const ACTION_SCHEMA=1;
const todayISO=()=>{
  const d=new Date(), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
};
const addISO=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const stableHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function splitExact(total,weights,scale){
  const mul=scale||1, target=Math.round((total||0)*mul), sum=weights.reduce((a,b)=>a+b,0)||1;
  const raw=weights.map(w=>target*w/sum), vals=raw.map(Math.floor);
  let rest=target-vals.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-vals[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(x=>vals[x[1]]++);
  return vals.map(v=>v/mul);
}
function enrichMetrics(rows){
  rows.forEach(r=>{
    if(!r.metrics){r.channelMetrics=[];return;}
    if(r.kind!=='paid'){
      r.metrics.revenue=null;
      const ws=r.channels.map((c,i)=>1+(stableHash(r.id+c.platform+i)%80)/100);
      const views=splitExact(r.metrics.impressions||0,ws,1);
      r.channelMetrics=r.channels.map((c,i)=>({platform:c.platform,impressions:views[i],clicks:0,installs:0,spend:0,revenue:0}));
      return;
    }
    const roas=.58+(stableHash(r.id)%143)/100;
    r.metrics.revenue=Math.round(r.metrics.spend*roas*100)/100;
    const ws=r.channels.map((c,i)=>.65+(stableHash(r.id+c.platform+i)%105)/100);
    const imp=splitExact(r.metrics.impressions,ws,1), clicks=splitExact(r.metrics.clicks,ws,1);
    const installs=splitExact(r.metrics.installs,ws,1), spend=splitExact(r.metrics.spend,ws,100);
    const revenue=splitExact(r.metrics.revenue,ws,100);
    r.channelMetrics=r.channels.map((c,i)=>({platform:c.platform,impressions:imp[i],clicks:clicks[i],installs:installs[i],spend:spend[i],revenue:revenue[i]}));
  });
}
function readActionStore(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    return saved&&saved.schema===ACTION_SCHEMA&&Array.isArray(saved.ops)?saved.ops:[];
  }catch(e){return [];}

const GEO={
  /* 数据通道 = 层宽。层高改回**等高**：
     ① 等高下任何一层的两行字都不会被压扁，也不会挡住层间流转率标注；
     ② 层高编码会导致「最上层永远最高、逐层递减」，那是层级顺序的副产物而不是信息。 */
  /* POWER=0.5 是两个约束的交点：既让首层肩部不至于陡出其他层 3 倍，
     又让末层下边正好收到 ≈216（手绘参考的 0.47 收口）。 */
  W_TOP:460, POWER:0.5, W_MIN:118,
  SHAPE_H:84, ROW_H:84,
  TOP:14, SPLIT_Y:46,
  /* 两套中心：基准 d 用 CX_SOLO 生成，分支显示时给 g.layer 叠加 translateX(LX_SHIFT)。
     d 不变 → 过渡成立（d 属性不可插值）。 */
  CX_SOLO:350,          /* 分支隐藏：五层居中于 700 舞台，350±230 = 120..580 */
  CX_SPLIT:259,         /* 分支显示：层 + 分支作为一个内容块居中，29..671 */
  STEM_X:499,           /* = CX_SPLIT + 240（层右边缘 489 + 10 呼吸） */

};
GEO.CX=GEO.CX_SOLO;
GEO.LX_SHIFT=GEO.CX_SPLIT-GEO.CX_SOLO;        /* = -91 */
const K=GEO.MINI_K;

/* 四点多边形。圆角为 0 —— 圆角会在接缝处把直边啃出扇贝状豁口，这是「参差不齐」的来源 */
function quad(cx,wt,wb,y,h){
  return 'M'+(cx-wt/2)+' '+y+'H'+(cx+wt/2)+'L'+(cx+wb/2)+' '+(y+h)+'H'+(cx-wb/2)+'Z';

let geom=[], GEOM_H=0;
/* 层宽 ∝ 条数（幂次 0.62 介于线性与平方根之间，保证五层全部肉眼可区分）。
   剪影整齐的三条硬约束：
   ① 每层下边宽 **严格等于** 下一层上边宽 → 接缝零错台，轮廓是一条连续折线；
   ② 每层都关于中轴对称 → 该层左右两条斜边斜率绝对值相同；
   ③ 无圆角、无描边、无每层投影 → 接缝处不会被啃出扇贝豁口。
   跨层的斜率变化不是瑕疵，它就是各层收窄幅度的差异，即数据本身。 */
function buildGeom(cs){

  const ws=cs.map(n=>Math.max(GEO.W_MIN,GEO.W_TOP*Math.pow(Math.max(n,0)/n0,GEO.POWER)));
  /* 末层下边沿最后一段的收口速率再延一层，否则末层是平底、收不住口 */
  const wEnd=Math.max(GEO.W_MIN*0.7,2*ws[4]-ws[3]);
  GEOM_H=5*GEO.ROW_H;
  return cs.map((n,i)=>{
    const w=ws[i], wb=i<4?ws[i+1]:wEnd, y=GEO.TOP+i*GEO.ROW_H, h=GEO.SHAPE_H;
    return {i,n,h,w,wb,y,left:GEO.CX-w/2,right:GEO.CX+w/2,d:quad(GEO.CX,w,wb,y,h)};
